                    {"id": "yazisma_73", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, ilgide belirtilen belge gerçek kişiden geliyorsa ve muhatap bu başvurunun sahibi değilse, ilgi bölümü aşağıdakilerden hangisine uygun olarak yazılır?", "dogruCevap": "...'ın... tarihli başvurusu/dilekçesi.", "yanlisCevaplar": ["...'ın.... tarihli yazısı.", "... tarihli dilekçe.", "Gerçek kişinin adı-soyadı yazılmaz, sadece “İlgi: Dilekçe” ifadesi yeterlidir.", "... tarafından gönderilen belgeye atıf yapılmaz."]},
                    {"id": "yazisma_74", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, ilgi bölümü ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "“İlgi” yan başlığı, muhatap bölümünün son satırından itibaren bir satır boşluk bırakılarak ve yazı alanının solundan başlanarak yazılır.", "yanlisCevaplar": ["Gerçek kişi ve tarih bilgisi bulunmayan başvuru/dilekçe ilgi tutulmak istendiğinde, ilgi bölümü “İsimsiz ve tarihsiz başvuru/dilekçe.” biçiminde yazılır. Söz konusu başvurunun/dilekçenin işleme alınıp alınmayacağı ilgili mevzuat hükümlerine göre değerlendirilir.", "İlgide belirtilen belge, muhatapta bulunmadığı durumlarda söz konusu belge, ek olarak muhatabına iletilebilir.", "İlgide, *... tarihli ve ... sayılı...” ibaresi kullanılır ve ilginin sonuna nokta (.) işareti konulur.", "İlgide yer alan bilgiler bir satırı geçerse, devamı “İlgi:” yan başlığının ve sıralamayı gösteren harflerin altı boş bırakılarak alt satıra yazılır."]},
                    {"id": "yazisma_75", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metin alanı belge üzerinde aşağıdakilerin hangisi arasında yer alır?", "dogruCevap": "İlgi veya Muhatap ile İmza arasında", "yanlisCevaplar": ["Sayı ve Tarih ile Konu arasında", "Başlık ile Muhatap arasında", "Konuile Ekler arasında", "Muhatap ile Dağıtım arasında"]},
                    {"id": "yazisma_76", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metin başlangıcından önce aşağıdaki hangi durumda iki satır boşluk bırakılır?", "dogruCevap": "Belgenin “İlgi” bölümü bulunmuyorsa", "yanlisCevaplar": ["Belgenin muhatabı gerçek kişiyse", "Belgenin ekleri fazlaysa", "Belge dağıtımlı gönderiliyorsa", "Belge fiziksel ortamda hazırlanıyorsa"]},
                    {"id": "yazisma_77", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metin içerisinde noktalama işaretleri ve boşluklarla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "dogruCevap": "Noktalama işaretlerinden sonra bir karakter boşluk bırakılır, önceki kelimeye bitişik yazılır", "yanlisCevaplar": ["Her noktalama işaretinden önce ve sonra bir karakter boşluk bırakılır", "Kelime aralarına çift boşluk bırakılır", "Noktalama işaretleri, kendilerinden sonra gelen kelimeye bitişik yazılır", "Noktalama işaretleri hem öncesine hem sonrasına boşluk alır"]},
                    {"id": "yazisma_78", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belge metninde paragraf düzeni aşağıdakilerden hangisine uygun olmalıdır?", "dogruCevap": "Paragrafa 1,25 cm içeriden başlanır ve metin iki yana hizalanır", "yanlisCevaplar": ["Paragrafa 1 cm içeriden başlanır ve metin sola hizalanır", "Paragrafa satır başından başlanır ve metin sağa hizalanır", "Paragrafa 1,5 cm içeriden başlanır ve metin iki yana hizalanır", "Paragrafa 1,25 cm içeriden başlanır ve metin sağa hizalanır"]},
                    {"id": "yazisma_79", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metin bölümü ile ilgili aşağıdaki ifadeki ifadelerden hangisi yanlıştır?", "dogruCevap": "Birden fazla sayfa tutan üst yazılarda sayı, tarih, konu, muhatap ve ilgi bilgilerine sadece son sayfada; imza, ek ve dağıtım bilgilerine ise sadece ilk sayfada yer verilir", "yanlisCevaplar": ["“İlgi” ile metin başlangıcı arasında bir satır, “İlgi” yoksa belgenin muhatabı ile metin başlangıcı arasında iki satır boşluk bulunur.", "Metindeki kelime aralarında ve noktalama işaretlerinden sonra bir karakter boşluk bırakılır. Noktalama işaretleri kendinden önce gelenharfe bitişik yazılır.", "Metin alanı, “Muhatap” veya varsa “İlgi” ile “İmza” arasındaki kısımdır.", "Paragrafa 1,25 cm içeriden başlanır ve metin iki yana hizalanır. Paragraflar arasında satır boşluğu bırakılmaz. İhtiyaç duyulması hâlinde paragraflar harf veya rakam ile sıralanabilir."]},
                    {"id": "yazisma_80", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, aşağıdakilerden hangisinin yazımı kurallara uygundur?", "dogruCevap": "6.464", "yanlisCevaplar": ["6464", "6,464", "6 464", "6.464."]},
                    {"id": "yazisma_81", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metinde belge diline ve yabancı kelime kullanımına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "Belgelerde yabancı kelimelere kesinlikle yer verilmez, istisna tanınmamıştır.", "yanlisCevaplar": ["Belgeler Türk Dil Kurumu'nun Yazım Kılavuzu ve Türkçe Sözlük esas alınarak yazılır.", "Yabancı dilde hazırlanan belgelerle birlikte Türkçe tercümesi oluşturularak saklanmalıdır.", "Zorunlu hâllerde belgede yabancı kelime kullanılabilir, bu durumda anlamı parantez içinde belirtilir.", "Muhatabı yabancı ülke olan belgelerde uluslararası yazışma usullerine göre belge düzenlenebilir."]},
                    {"id": "yazisma_82", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metin içinde maddelendirme amacıyla Türk alfabesindeki küçük harfler aşağıdakilerden hangisi şeklinde kullanılmalıdır?", "dogruCevap": "a) b) c)", "yanlisCevaplar": ["a. b. c.", "(a) (b) (c)", "“a” “b” “e”", "a- b- c-"]},
                    {"id": "yazisma_83", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, metin içinde bir kısaltma ilk kez kullanılacaksa hangi yöntem uygulanmalıdır?", "dogruCevap": "Önce ifadenin açık biçimi, sonra parantez içinde kısaltması yazılır", "yanlisCevaplar": ["Kısaltma doğrudan kullanılır, açıklamaya gerek yoktur", "Kısaltma küçük harflerle yazılır, sonunda nokta bulunur", "Kısaltma büyük harflerle yazılır, sonunda nokta bulunur", "Önce kısaltma, sonra parantez içinde açık hali verilir"]},
                    {"id": "yazisma_84", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, aşağıdakilerden hangisi metin içinde kısaltma kullanımı açısından doğrudur?", "dogruCevap": "Türkiye İş Kurumu (İŞKUR) tarafından alınan kararlar...", "yanlisCevaplar": ["TSE (Türk Standardları Enstitüsü) tarafından yayımlanan standartlar...", "BOTAŞ (Boru Hatları ile Petrol Taşıma Anonim Şirketi) tarafından yürütülen proje...", "KEP (Kayıtlı Elektronik Posta) üzerinden gönderilen belge...", "T.C. Merkez Bankası (TCMB)'nın açıklamasına göre..."]},
                    {"id": "yazisma_85", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, aşağıdaki ifadelerden hangisinin yazışmanın muhatabı dikkate alındığında kullanımı doğrudur?", "dogruCevap": "Hiyerarşi yönünden üst bir makama yazılan yazının “Arz ederim.” ifadesiyle bitirilmesi", "yanlisCevaplar": ["Muhatap kısmında ikinci satırda parantez içerisinde birim veya idare ismi belirtilen yazışmalar, birinci satırda yer alan muhatap idare dikkate alınarak yalnızca arz ederim ile bitirilmesi", "Üst, alt ve aynı düzey makamlara dağıtımlı yapılan yazışmanın “Rica ederim.” ifadesiyle bitirilmesi", "Gerçek kişiye yazılan yazının “Arz ve rica ederim.” ifadesiyle bitirilmesi", "Cumhurbaşkanlığı İdari İşler Başkanı tarafından bakanlıklara yazılan yazının “Arz ederim.” ifadesiyle bitirilmesi"]},
                    {"id": "yazisma_86", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, imza bölümü belge üzerinde nasıl yer almalıdır?", "dogruCevap": "Metnin bitiminden itibaren iki ila dört satır boşluk bırakılarak, yazı alanının en sağında ortalanarak yer alır", "yanlisCevaplar": ["Metnin hemen altında, yazı alanının soluna yaslı olarak yer alır", "Metnin bitiminden sonra iki satır boşluk bırakılarak sayfa ortasına yazılır", "Sayfanın en altına, sol alt köşeye unvan, ad ve soyad sırasıyla yazılır", "Başlığın hemen altına, ad ve unvan bilgileriyle birlikte yazılır"]},
                    {"id": "yazisma_87", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belgeyi imzalayan kişinin adı, soyadı ve unvanı aşağıdakilerden hangisine uygun şekilde yazılmıştır?", "dogruCevap": "Ahmet YILMAZ Şube Müdürü", "yanlisCevaplar": ["AHMET YILMAZ Şube müdürü", "AHMET YILMAZ ŞubeMüdürü", "Ahmet Yılmaz ŞUBEMÜDÜRÜ", "Ahmet YILMAZ Şubemüdürü"]},
                    {"id": "yazisma_88", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, imza ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "dogruCevap": "Yetkili makam, belgeyi güvenli elektronik imza ile imzalar ve ad-soyad üzerinde ayrıca herhangi bir ibare, şekil veya işaret yer almaz.", "yanlisCevaplar": ["Belge, imzalanmadan önce sadece elektronik onay ile gönderilebilir.", "Yetkili makamın ad ve soyad bilgilerinin altına “e-imza ile imzalanmıştır” notu düşülmelidir.", "Belgeye ıslak imza atıldıktan sonra elektronik imzayla desteklenmelidir.", "Elektronik ortamda gönderilen belgelerde imza yerine sadece unvan yazılması yeterlidir."]},
                    {"id": "yazisma_89", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, imza ile ilgili aşağıda verilen bilgilerden hangisi yanlıştır?", "dogruCevap": "Metnin bitiminden itibaren bir satır boşluk bırakılarak, belgeyi imzalayacak olan makam sahibinin adına, soyadına ve bunların altında unvanına, yazı alanının en solunda ortalanarak yer verilir.", "yanlisCevaplar": ["Belgeyi imzalayanın adı ilk harfi büyük diğerleri küçük, soyadı ise büyük harflerle yazılır. Unvan, ad ve soyadın altına ilk harfleri büyük diğerleri küçük harflerle yazılır.", "Elektronik ortamda yapılacak resmi yazışmalarda, imza atmaya yetkili makam belgeyi güvenli elektronik imzası ile imzalar. Elektronik ortamda yapılan yazışmalarda, yetkili makamın ad ve soyad bilgilerinin üzerinde belgenin güvenli elektronik imza ile imzalandığına dair herhangi bir ibareye, şekle veya ifadeye yer verilmez.", "EBYS'ler, belgede yer alan imzanın dayanağı olan teknik standartta belirtilen arşivleme metodunu destekler, imzanın ilgili teknik standarda göre “arşiv imzası” tipine dönüştürülebilmesini ve uzun dönemli doğrulanabilmesini sağlar nitelikte olmalıdır.", "Resmi yazışma sürecinde, imza yetkisi bulunan görevlilere idarece güvenli elektronik imza temin edilir. Münhasıran şahsına ait özlük işlemleriyle ilgili yazışmalarda imzası aranan personelin güvenli elektronik imzasının bulunmadığı durumlarda, personelin özlük işlemine ilişkin talebi idarenin belirleyeceği usule göre alınır."]},
                    {"id": "yazisma_90", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belgeyi imza yetkisi devredilen makam imzaladığında aşağıdaki yazım düzenlerinden hangisi doğrudur?", "dogruCevap": "İlk satıra imzalayanın adı-soyadı, ikinci satıra “Genel Müdür a.” gibi yetki devreden makam, üçüncü satıra imzalayanın unvanı yazılır", "yanlisCevaplar": ["İlk satıra yetki devreden makamın adı, ikinci satıra unvan, üçüncü satıra imzalayanın adı yazılır", "İlk satıra imzalayanın adı-soyadı, ikinci satıra unvanı, üçüncü satıra \"a.\" ibaresiyle yetki devreden makam yazılır", "İlk satıra “Bakan a”, ikinci satıra imzalayanın adı-soyadı, üçüncü satıra unvan yazılır", "İmza yetkisi devredildiyse belgeye sadece imzalayanın adı ve unvanı yazılır, yetki devreden belirtilmez"]},
                    {"id": "yazisma_91", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, bir belge vekâleten imzalanıyorsa aşağıdaki yazım düzenlerinden hangisi doğrudur?", "dogruCevap": "İlk satıra imzalayanın adı-soyadı, ikinci satıra “Genel Müdür V. gibi vekâlet olunan makam yazılır", "yanlisCevaplar": ["İlk satıra vekâlet edilen makam, ikinci satıra imzalayanın adı-soyadı yazılır", "İlk satıra imzalayanın adı-soyadı, ikinci satıra “Genel Müdür a.” ibaresi yazılır", "Sadece imzalayanın adı-soyadı yazılır, unvana yer verilmez", "İlk satıra “Vekâleten”, ikinci satıra ad-soyad, üçüncü satıra kurum adı yazılır"]},
                    {"id": "yazisma_92", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belge eklerine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "“Ek: başlığı imza bölümünden hemen önce, belge sonlanmadan önce yazılır ve sola yaslanır.", "yanlisCevaplar": ["Belgede yalnızca bir ek varsa, “Ek:” başlığının sağında eki belirten açıklamaya yer verilir.", "Birden fazla ek varsa her bir ek için “EK-1”, “EK-2” gibi numaralandırma yapılır ve bu numara ekin sağ üst köşesinde yer alır.", "Ek listesi yazı alanına sığmayacak kadar uzunsa, “EK LİSTESİ” başlığıyla ayrı bir belgede yazılır ve üst yazıda “Ek: Ek Listesi” şeklinde belirtilir.", "Üst yazıyla gönderilemeyen ekler, üst yazıyla ilişkilendirilerek ayrı olarak da gönderilebilir veya muhafaza edilebilir."]},
                    {"id": "yazisma_93", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, bir belgenin birden fazla eki varsa bu ekler nasıl belirtilmelidir?", "dogruCevap": "Her bir ek “Ek” başlığının altında numaralandırılarak yazılır, açıklayıcı bilgiler parantez içinde verilir", "yanlisCevaplar": ["Tümü \"EK başlığı altında virgülle ayrılarak tek satırda yazılır", "Ek başlığının sağında numarasız şekilde sıralanır", "Eklistesi yalnızca belgeye iliştirilen kağıt üstüne yazılır, metne ek bilgisi girilmez", "Ekler ayrı bir sayfada listelenmeli, üst yazıda “Ek yoktur” ifadesiyle gösterilmelidir"]},
                    {"id": "yazisma_94", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, ek listesi yazı alanına sığmayacak kadar uzunsa aşağıdakilerden hangisi uygulanır?", "dogruCevap": "Eklistesi ayrı bir sayfada “EK LİSTESİ” başlığı altında gösterilir ve üst yazıda “Ek: Ek Listesi” ifadesiyle belirtilir", "yanlisCevaplar": ["Eklerin yalnızca sayfa sayısı yazılır ve üst yazıda ek bilgisi yer almaz", "Ekler sadece dağıtım listesinde belirtilir", "Eklistesi sayfa altına küçük puntolarla yazılır ve ayrıca üst yazıya ek bilgisi girilmez", "Eklistesi elektronik dosyada saklanır ancak fiziksel belgeye eklenmez"]},
                    {"id": "yazisma_95", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, aşağıdaki durumlardan hangisinde belgeye \"Dağıtım\" bölümü eklenmesi gerekir?", "dogruCevap": "Belge birden fazla muhataba gönderiliyorsa", "yanlisCevaplar": ["Belge sadece arşivlik bir işlem için hazırlanmışsa", "Belge yalnızca kurum içi birime gönderiliyorsa", "Belge tek bir muhataba gönderiliyorsa", "Belgeye ek konulmamışsa"]},
                    {"id": "yazisma_96", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belgede ek bulunmuyorsa “Dağıtım:” başlığı belge üzerinde hangi bölümden sonra yazılır?", "dogruCevap": "İmza bölümünden sonra", "yanlisCevaplar": ["Konu bölümünden sonra", "Sayı ve tarih satırından sonra", "Muhatap bölümünden sonra", "Metin bölümünden hemen sonra"]},
                    {"id": "yazisma_97", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, aşağıdaki ifadelerden hangisi dağıtım bölümündeki “Gereği” ve “Bilgi” ayrımı açısından doğrudur?", "dogruCevap": "“Gereği:” kısmına işlemi gerçekleştirecek olanlar, “Bilgi:” kısmına içeriği hakkında bilgilendirilmesi gerekenler yazılır", "yanlisCevaplar": ["“Gereği:” kısmına belgeyi gönderen kurum yazılır", "“Bilgi:” kısmına belgeyi imzalayan makam yazılır", "“Gereği:” kısmına belgeyi sadece arşivleyecek birimler yazılır", "“Gereği:” kısmına işlemi yapacak olanlar, “Bilgi:” kısmına sadece üst makamlar yazılır"]},
                    {"id": "yazisma_98", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, dağıtım bölümü yazı alanına sığmayacak kadar uzunsa aşağıdaki uygulamalardan hangisi doğrudur?", "dogruCevap": "“Dağıtım” başlığı altına “DAĞITIM LİSTESİ” yazılır ve liste ayrı bir sayfada “DAĞITIM LİSTESİ” başlığıyla sunulur", "yanlisCevaplar": ["Belgeye dağıtım bilgisi yazılmaz, yalnızca ekler kısmında yer verilir", "“Dağıtım” başlığı hiç yazılmaz, tüm muhataplar ek dosyada listelenir", "Dağıtım bölümünün sonuna “devamı ek listede” ifadesi yazılır", "Yazı alanına sığmayan kısım çıkarılır ve sadece öncelikli kurumlara yer verilir"]},
                    {"id": "yazisma_99", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, olur ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "Zorunlu hâllerde veya olağanüstü durumlarda hazırlanan olur yazılarında “OLUR\" ibaresinden sonra tarih ve imza için uygun boş satır bırakılarak ilk satırda unvan bilgilerine, ikinci satırda ise imzalayanın adı ve soyadına yer verilir", "yanlisCevaplar": ["Makam oluru alınan belgeler, ilgili birimin yöneticisi tarafından güvenli elektronik imza ile teklif edilir ve oluru alınan makam tarafından güvenli elektronik imza ile imzalanır.", "Zorunlu hâllerde veya olağanüstü durumlarda imzalar el yazısıyla atılır.", "Belge, olur için makama sunulurken imza bölümünden sonra uygun boş satır bırakılarak yazı alanının ortasına büyük harflerle “OLUR” yazılır. “OLUR” ibaresinin alt satırına imzalayanın adı ilk harfi büyük diğerleri küçük, soyadı büyük ve bir alt satıra unvanı ilk harfleri büyük diğerleri küçük harflerle ortalanarak yazılır.", "Oluru teklif eden birim ile olur alınan makam arasında başka makamlar varsa bunlar olura katılabilir. Teklif eden birim yetkilisinin imza bölümü ile “OLUR” ibaresinin bulunduğu bölüm arasına uygun boşluk bırakılarak yazı alanının solunda yer alacak şekilde “Uygun görüşle arz ederim.” ibaresi yazılır ve bu ibarenin alt satırına imzalayanın adı ilk harfi büyük diğerleri küçük, soyadı büyük ve bir alt satıra unvanı ilk harfleri büyük diğerleri küçük harflerle ortalanarak yazılır."]},
                    {"id": "yazisma_100", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, makam oluru alınan bir belgede aşağıdakilerden hangisi doğrudur?", "dogruCevap": "Teklif edilen belge, öncelikle ilgili birim yöneticisi tarafından güvenli elektronik imza ile imzalanır, ardından oluru alınan makam tarafından imzalanır", "yanlisCevaplar": ["Belge sadece oluru alınan makam tarafından güvenli elektronik imza ile imzalanır, teklif eden birimin imzası gerekmez", "Belge yalnızca teklif eden birimin yöneticisi tarafından paraflanır, imzaya gerek yoktur", "Makam oluru alınan belgelerde sadece fiziksel imza kullanılması zorunludur", "Olur belgelerinde sadece teklif edilen kısımda imza yer alır, onay kısmı boş bırakılır"]},
                    {"id": "yazisma_101", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, oluru teklif eden birim ile olur alınan makam arasında başka makamlar varsa ve aradaki makam olura katılıyorsa, bu makam tarafından yazı alanının solunda ve teklif eden birim yetkilisinin imzası ile “OLUR” ibaresi arasında aşağıdaki ifadelerden hangisi yazılır?", "dogruCevap": "Uygun görüşle arz ederim.", "yanlisCevaplar": ["Gereği yapılmak üzere arz olunur.", "Bilgi edinilmesini rica ederim.", "Emir ve müsaadelerinize arz ederim.", "Olur verilmiştir."]},
                    {"id": "yazisma_102", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, paraf uygulamasına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "Paraf bölümünde tarih, unvan, ad ve soyad bilgileri kısaltmalı olarak belirtilir.", "yanlisCevaplar": ["Güvenli elektronik imza ile imzalanan belgelerde paraf bilgileri belgenin üstverisinde tutulur.", "Elektronik onaylar EBYS'nin günlük raporlarında kayıt altına alınır ve zaman damgasıyla damgalanır.", "Fiziksel belgelerde paraflar yalnızca idarede kalacak nüshada, yazı alanının sonunda ve sol kenarında yer alır.", "El yazısıyla atılan paraf, kaybolmayacak şekilde mavi kalemle atılır."]},
                    {"id": "yazisma_103", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, güvenli elektronik imza ile imzalanan bir belgeye ait paraf bilgileri nerede tutulur?", "dogruCevap": "Belgenin üstverisinde", "yanlisCevaplar": ["Belgenin sağ alt köşesinde", "Ek sayfasında", "İmza bölümünde", "Dağıtım listesinin hemen altında"]},
                    {"id": "yazisma_104", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, zorunlu hâllerde veya olağanüstü durumlarda el yazısıyla atılan paraflar hangi renkte kalemle atılmalıdır?", "dogruCevap": "Mavi", "yanlisCevaplar": ["Siyah", "Kırmızı", "Yeşil", "Sarı"]},
                    {"id": "yazisma_105", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, idare içinde birden fazla birimin iş birliği ile hazırlanan ve yetkili makamın imzasına sunulan belgelerde “Koordinasyon” seçimi ne zaman yapılır?", "dogruCevap": "Belgeyi hazırlayan birime ait paraf hiyerarşisinden sonra", "yanlisCevaplar": ["Belge metni yazıldıktan hemen sonra", "Belge imzaya sunulmadan önce, ek listesi hazırlandığında", "Ekler ve dağıtım listesi oluşturulduktan sonra", "Belgeye ilişkin tüm kurum görüşleri alındıktan sonra"]},
                    {"id": "yazisma_106", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, “Bu belge, güvenli elektronik imza ile imzalanmıştır.” ibaresi aşağıdaki alanlardan hangisinde yer alır?", "dogruCevap": "İletişim bilgileri alanını belirleyen çizginin üstünde", "yanlisCevaplar": ["Başlığın hemen altında", "Sayı ve tarih satırının altında", "İletişim bilgileri alanının altında", "Belgenin ekler bölümünde"]},
                    {"id": "yazisma_107", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belge doğrulama işlemi aşağıdakilerden hangisi ile ve nereden gerçekleştirilir?", "dogruCevap": "Doğrulama kodu ve karekod ile Dijital Türkiye (e-Devlet) üzerinden", "yanlisCevaplar": ["Belge numarası ile Kurum Evrak Takip Sisteminden", "Belge eki numarası ile Resmi Yazışma Portalından", "Paraf bilgisi ile Kurum İçi İletişim Platformundan", "Elektronik onay kodu ile Cumhurbaşkanlığı sitesinden"]},
                    {"id": "yazisma_108", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, iletişim bilgileri alanında solda yer alacak bilgilerden biri değildir?", "dogruCevap": "Bilgi alınacak kişinin unvanı", "yanlisCevaplar": ["Kayıtlı elektronik posta (KEP) adresi", "Gönderen idarenin telefon numarası", "Gönderen idarenin internet adresi", "Gönderen idarenin faks numarası"]},
                    {"id": "yazisma_109", "soruMetni": "I. Bilgi alınacak kişinin unvanı\nII. Gönderen idarenin posta kodu\nIII. Bilgi alınacak kişinin adı ve soyadı\nIV. Bilgi alınacak kişinin telefon numarası\nResmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, yukarıdakilerden hangileri iletişim bilgileri alanında sağda yer alan bilgilerden değildir?", "dogruCevap": "Yalnız II", "yanlisCevaplar": ["Yalnız I", "Yalnız III", "II ve IV", "I ve III"]},
                    {"id": "yazisma_110", "soruMetni": "I. Belgenin imzacısı olan yetkili makam, belgeye ait gizlilik derecesinin belirlenmesinden sorumludur.\nII. “Hizmete Özel” gizlilik derecesi bulunan belgelerin hazırlanması, kaydedilmesi, saklanması, gönderilmesi, alınması ve diğer işlemleri fiziksel ortamda gerçekleştirilir.\nIII.“Özel” ve üstü gizlilik dereceli belgelerin hazırlanması, kaydedilmesi, saklanması, gönderilmesi, alınması ve diğer işlemler ilgili mevzuatta belirtilen hükümlere uygun olarak elektronik ortamda gerçekleştirilir.\nResmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, gizlilik dereceli belgeler ile ilgili yukarıda verilen ifadelerden hangisi/hangileri doğrudur?", "dogruCevap": "Yalnız I", "yanlisCevaplar": ["Yalnız II", "Yalnız III", "I ve II", "II ve III"]},
                    {"id": "yazisma_111", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, süreli ve kişiye özel yazışmalar ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "Elektronik ortamda veya zorunlu hâllerde ya da olağanüstü durumlarda hazırlanan süreli belgelerde “ACELE” veya “GÜNLÜDÜR” ibaresi yazı alanının sol üst köşesinde mavi renkli olarak belirtilir.", "yanlisCevaplar": ["“KİŞİYE ÖZEL” ibaresi taşıyan belgenin zarfı açılmadan zarf üzerinde yer alan bilgiler, yetkili birimce EBYS'ye veya kurumsal belge kayıt sistemine kaydedilir ve ilgilisine teslim edilir.", "“KİŞİYE ÖZEL” ibaresi, belgenin ilgilisine teslim edilmesini ve sonrasında yürütülecek süreci ifade eder.", "Güvenli elektronik imza ile imzalanan süreli belgelerde “ACELE” veya “GÜNLÜDÜR ibaresine üstveride ve üst yazı üzerinde yer verilir. “SÜNLÜDÜR ibaresi taşıyan belgelere cevap verilmesi gereken süre veya tarih, metin içinde ve ilgili üstveri alanında belirtilir.", "“ACELE\" ibaresi taşıyan belgeye derhâl ve süratle; “GÜNLÜDÜR\" ibaresi taşıyan belgeye belirtilen süre içinde cevap verilir."]},
                    {"id": "yazisma_112", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, güvenli elektronik imza ile imzalanan süreli belgelerde “ACELE” veya “GÜNLÜDÜR” ibareleri nereye yazılır?", "dogruCevap": "Üstveriye ve üst yazı üzerine", "yanlisCevaplar": ["Sadece ekler kısmına", "Dağıtım bölümünün altına", "Belge doğrulama kodunun yanına", "Belgeyi gönderenin ad-soyad satırının hemen altına"]},
                    {"id": "yazisma_113", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, “ACELE” ibaresi taşıyan bir belgeye ne kadar zaman içinde cevap verilmelidir?", "dogruCevap": "Derhâl ve süratle", "yanlisCevaplar": ["Belirtilen sürede", "Aynı gün mesai bitimine kadar", "24 saat içinde", "En geç 3iiş günü içinde"]},
                    {"id": "yazisma_114", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, “GÜNLÜDÜR” ibaresi taşıyan bir belgeye ne kadar sürede cevap verilmelidir?", "dogruCevap": "Belirtilen süre içinde", "yanlisCevaplar": ["Aynı gün içerisinde", "24 saat içinde", "Engeç3iş günü içinde", "İlk mesai saatinde"]},
                    {"id": "yazisma_115", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, elektronik ortamda veya zorunlu hâllerde ya da olağanüstü durumlarda hazırlanan süreli belgelerde “ACELE” veya “GÜNLÜDÜR” ibaresi yazı alanının sağ üst köşesinde hangi renkle belirtilir?", "dogruCevap": "Kırmızı", "yanlisCevaplar": ["Siyah", "Mavi", "Koyu gri", "Yeşil"]},
                    {"id": "yazisma_116", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, bir belgeye “KİŞİYE ÖZEL” ibaresi eklenmişse bu durum neyi ifade eder?", "dogruCevap": "Belgenin ilgilisine teslim edilmesini ve sonrasında yürütülecek süreci", "yanlisCevaplar": ["Belgenin gizlilik derecesinin “ÇOK GİZLİ” olduğunu", "Belgenin sadece bilgi amaçlı gönderildiğini", "Belgenin sadece resmi kurum arşivine iletileceğini", "Belgenin sadece dağıtım listesinde yer alanlara açık olduğunu"]},
                    {"id": "yazisma_117", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, “KİŞİYE ÖZEL” ibaresi taşıyan bir belgenin işlenme ve teslim süreciyle ilgili aşağıdakilerden hangisi doğrudur?", "dogruCevap": "Belge yalnızca ilgilisine teslim edilir, EBYS'ye ancak ilgilinin talebi ile kaydedilir", "yanlisCevaplar": ["Belge, yetkili birimce açıldıktan sonra üstverisi oluşturularak sisteme kaydedilir", "Belge EBYS'ye kaydedilmeden önce idarenin arşiv birimince tasnif edilir", "Belgeyi alan kişi dışındaki birim yetkilileri belgeyi görüntüleyebilir", "Belge doğrudan elektronik ortamda imzalanarak tüm personele açık hâle getirilir"]},
                    {"id": "yazisma_118", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, birden fazla sayfadan oluşan belgelerde sayfa numarası nereye ve nasıl yazılır?", "dogruCevap": "İletişim bilgilerinin hemen altına, sayfanın ortasına ve toplam sayfa sayısını gösterecek şekilde", "yanlisCevaplar": ["Sayfanın sol alt köşesine “Sayfa: 1” şeklinde", "Sayfanın üst sağ köşesine, toplam sayfa sayısı belirtilmeden", "Sayfanın üst kısmına, başlık hizasında ortalanarak", "Ekler bölümüne, her sayfa için ayrı ayrı yazılarak"]},
                    {"id": "yazisma_119", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, güvenli elektronik imza ile imzalanan bir belgenin çoğaltılması ve doğrulanması işlemleriyle ilgili aşağıdaki ifadelerden hangisi doğrudur?", "dogruCevap": "Güvenli elekironik imzalı belge, yetkilendirilmiş görevlilerce çıktı alınarak çoğaltılır ve doğrulama işlemi karekod ve doğrulama kodu ile e-Devlet üzerinden yapılır", "yanlisCevaplar": ["Belge, yalnızca sistem yöneticisi tarafından çoğaltılabilir ve doğrulama yapılmasına gerek yoktur", "Çoğaltılan belge yalnızca fiziki arşiv için geçerli olup, doğruluğu teyit edilemez", "Belge, ilgilinin talebiyle çoğaltılabilir ve doğrulama yalnızca kurum içi portaldan yapılır", "Çoğaltılan belgeye tekrar güvenli elektronik imza atılması zorunludur"]},
                    {"id": "yazisma_120", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, zorunlu hâllerde, olağanüstü durumlarda veya yönetmeliğin yürürlüğe girmesinden önce fiziksel ortamda hazırlanmış bir belgeden örnek çıkarılması ile ilgili aşağıdakilerden hangisi doğru bilgidir?", "dogruCevap": "Çoğaltılan belgeye “ASLI GİBİDİR” ibaresi eklenir, yetkilendirilmiş görevli tarafından ad, soyad, unvan ve tarih belirtilerek imzalanır", "yanlisCevaplar": ["Belgeye yalnızca kurum mührü basılması yeterlidir", "“ASLI GİBİDİR” ibaresi yazılır ancak imzalanması zorunlu değildir", "Belge sadece kurum arşivi tarafından çoğaltılabilir ve imzalanması gerekmez", "Bu belgeler örneklenemez, yalnızca aslı kullanılabilir"]},
                    {"id": "yazisma_121", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, belgenin elektronik ortamda gönderilmesi ve alınması ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "dogruCevap": "Güvenli elektronik imza ile imzalanan belgeler, veri depolama araçlarıyla da iletilebilir. Bu durumda gönderme ve alma işlemine ilişkin kayıt tutulmaz.", "yanlisCevaplar": ["Resmi yazışma kapsamında idare dışına gönderilen güvenli elektronik imza ile imzalanan belgeler, gerekli hâllerde elektronik olarak şifrelenir. Elektronik belgelerin şifrelenmesi işlemi e-Yazışma Teknik Rehberi'nde tanımlandığı şekilde yapılır.", "Güvenli elektronik imza ile imzalanan belgelerin gönderilmesi ve alınması işlemlerinin, elektronik ortamda ilgili mevzuatla yetki verilmiş üçüncü bir taraf aracılığıyla kayıt altına alınarak yapılması esastır.", "İdare, resmi yazışma kapsamında kendisine iletilen ve e-Yazışma Teknik Rehberi'ne uygun şekilde hazırlanmış belgeleri işleme koymakla yükümlüdür.", "e-Yazışma Teknik Rehberi'nde tanımlanan şifreleme mekanizmasına uygun şekilde kendilerine şifreli belge iletilebilmesini talep eden idareler, kendileri için elektronik şifreleme sertifikası temin eder. İdareler için oluşturulan elektronik şifreleme sertifikaları DETSİS üzerinden paylaşılır."]},
                    {"id": "yazisma_122", "soruMetni": "Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, idarenin e-Yazışma Teknik Rehberi'ne uygun olarak kendisine iletilen belgelerle ilgili yükümlülüğü aşağıdakilerden hangisidir?", "dogruCevap": "Belgeyi işleme koymak", "yanlisCevaplar": ["Belgeyi yalnızca fiziki nüshası geldiyse işleme koymak", "Belgeyi üst makamın onayı olmadan reddetmek", "Belgeyi uygun biçime çevirdikten sonra arşivlemek", "Belgeyi yalnızca gönderici kurumun içeriği uygun görülürse kabul etmek"]},
                    {"id": "yazisma_123", "soruMetni": "İdare, başka bir idareden kendisine resmi yazışma kapsamında iletilen ve e-Yazışma Teknik Rehberi'nde tanımlanan kurallara uygun şekilde hazırlanmamış bir belgeyi reddetme hakkına sahiptir. Resmi Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre, bu durumda, kendisine iletilen belgeyi reddeden idare, gönderen idareye bu durumu sebepleriyle birlikte belgenin kendisine ulaştığı tarihi takip eden kaçıncı iş gününün sonuna kadar bildirir?", "dogruCevap": "İkinci", "yanlisCevaplar": ["Birinci", "Üçüncü", "Beşinci", "Yedinci"]},

                    {"id": "valilik_160", "soruMetni": "“Görevli kişi, bir dosyayı belli bir süre sonra tekrar görmek istiyorsa, adını, görev unvanını ve görmek istediği tarihi belirten yazılı bir fişi dosyaya ekleyerek …….. verir.\" Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, yukarıda verilen bilgide boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?", "dogruCevap": "Dosyalama memuruna", "yanlisCevaplar": ["Arşiv memuruna", "Evrak kabul görevlisine", "dosya sorumlusuna", "İl yazı işleri müdürüne"]},

                    {"id": "valilik_163", "soruMetni": "Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, aşağıdakilerden hangisi \"Dosyaların saklanması\" ile ilgili olarak kurallardan biri değildir?", "dogruCevap": "Klasörler, rastgele bir düzende dolap ve raflara yerleştirilir.", "yanlisCevaplar": ["Klasörler, dosya anahtarındaki sıraya göre yerleştirilir.", "Klasörler üzerinde numara ve ad bilgileri kolayca görülebilecek şekilde bulunur.", "Raf veya dolap üzerine o bölümdeki klasörlerin ilk ve son numaraları yazılır.", "Dosyaların saklandığı dolaplar, fiziksel erişim güvenliği açısından kilitli olmalıdır."]},
                    {"id": "valilik_164", "soruMetni": "Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, aşağıdakilerden hangisi, \"Dosyaların saklanmasında sorumluluk” kapsamında yer alan hükümlerden biri değildir?", "dogruCevap": "Dosyalar, görevli memurun haberi olmadan alınabilir ancak geri bırakılmalıdır.", "yanlisCevaplar": ["Valilik ve kaymakamlık birimlerinde dosyalar, görevli memurun sorumluluğundadır.", "Zorunlu hallerde dosyanın yerinden alındığına dair yazılı bir belge bırakılır.", "Evrak veya dosyanın kurum dışına çıkarılması kural olarak yasaktır.", "Hizmetin gerektirdiği durumlarda bazı görevliler evrakı kurum dışına çıkarabilir."]},

                    {"id": "valilik_166", "soruMetni": "Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, aşağıdakilerden hangisi kurulların kararlarının alınması kapsamında yer almaz?", "dogruCevap": "Kararlar, toplantıya katılan üyelerin oybirliği ile alınır.", "yanlisCevaplar": ["Kurullar, özel mevzuatında hüküm yoksa üyelerin yarısından fazlasıyla toplanır.", "Toplantıya katılmayan üyelerin özürleri karar tutanağında belirtilir.", "Karşı oy kullanan üyelerin gerekçeleri karar altında özetlenir.", "Oylamada eşitlik olursa başkanın bulunduğu taraf çoğunluk sayılır."]},
                    {"id": "valilik_167", "soruMetni": "\"Başkanlığını vali, vali yardımcısı veya kaymakamın yaptığı ve sekretarya hizmetleri valilik ve kaymakamlık birimleri dışındaki kuruluşlarca yürütülen kurullarda alınan kararların birer sureti, karar tarihini takip eden en geç ________ içinde ________ gönderilir.” Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, yukarıda verilen bilgide boş bırakılan yerlere sırasıyla aşağıdakilerden hangileri getirilmelidir?", "dogruCevap": "bir hafta — valilik veya kaymakamlığa", "yanlisCevaplar": ["On beş gün — Bakanlığa", "beş gün — ilgili kurumlara", "bir ay — İçişleri Bakanlığına", "On gün — İl yazı işleri müdürlüğüne"]},
                    {"id": "valilik_168", "soruMetni": "Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, aşağıdakilerden hangisi kurulların sekretarya hizmetleri kapsamında yer alan hükümlerden biri değildir?", "dogruCevap": "Sekretarya, kurulun tüm yazışma ve arşiv işlerinden bağımsız çalışır.", "yanlisCevaplar": ["Kurul veya komisyonların sekretarya hizmetleri ilgili birim tarafından yürütülür.", "Kurulda yalnızca başkanlıkça havale edilmiş konular görüşülebilir.", "Görüşülecek konu yoksa kurul toplanmaz, bu durum elektronik ortamda karar defterine işlenir.", "Görüşülecek konu bulunmayan toplantılar için başkanın imzasıyla belge düzenlenir."]},
                    {"id": "valilik_169", "soruMetni": "Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, aşağıdakilerden hangisi, il ve ilçe idare kurullarına görev olarak verilen konulara ait evrakın kaydı, karar özetinin tespiti ve işlemlerinin takibini sağlamak amacıyla idare kurulu biriminde elektronik ortamda tutulan defterin adıdır?", "dogruCevap": "İdare Kurulu Karar Özetleri Defteri", "yanlisCevaplar": ["Yazı İşleri Kayıt Defteri", "Evrak İşlem Takip Defteri", "Karar Kayıt ve Dosyalama Defteri", "Denetim Raporları Defteri"]},
                    {"id": "valilik_170", "soruMetni": "Valilik ve Kaymakamlık Birimleri Teşkilat, Görev ve Çalışma Yönetmeliği'ne göre, aşağıdakilerden hangisi İdare Kurulu Karar Özetleri Defteri ile ilgili verilen bilgilerden yanlıştır?", "dogruCevap": "Karar özetleri deftere manuel olarak yazılır ve daha sonra elektronik ortamda işlenir.", "yanlisCevaplar": ["Kararlar elektronik ortamda deftere işlenir ve çıktıları alınarak başkan ve üyelerce imzalanır.", "İmza işlemleri toplantı ve karar tarihinden sonra en kısa sürede tamamlanır.", "Gerekçeli asıl kararların imzalı asılları numara sırasına göre dizilerek ayrı bir dosyada saklanır.", "Gerekçeli kararların elektronik ortamda yeterli sayıda çıktısı alınır ve imzalatılır."]},

        let activeQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let wrongCountScore = 0;
        let selectedCourseId = null;
        let selectedQuestionCount = 5;
        
        let favorites = JSON.parse(localStorage.getItem("gys_favorites")) || [];
        let wrongAnswers = JSON.parse(localStorage.getItem("gys_wrongs")) || [];

        let currentShuffledOptions = [];
        let correctAnswerText = "";

        function updateGlobalCounts() {
            document.getElementById("favCount").innerText = favorites.length;
            document.getElementById("wrongCount").innerText = wrongAnswers.length;
            localStorage.setItem("gys_favorites", JSON.stringify(favorites));
            localStorage.setItem("gys_wrongs", JSON.stringify(wrongAnswers));
        }

        function initHome() {
            updateGlobalCounts();
            const courseList = document.getElementById("courseList");
            courseList.innerHTML = "";

            veriTabani.forEach(ders => {
                const card = document.createElement("div");
                card.className = "bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-pointer flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-700 text-xs">${ders.dersAdi}</h3>
                        <p class="text-[11px] text-slate-500 mt-0.5">Sınav Soru: ${ders.sinavSoruSayisi} | Havuz: ${ders.sorular.length}</p>
                    </div>
                    <span class="bg-blue-50 text-blue-600 px-2.5 py-1.5 rounded-lg font-semibold text-xs whitespace-nowrap ml-2">Seç ➔</span>
                `;
                card.onclick = () => openCourseDetail(ders.id);
                courseList.appendChild(card);
            });

            document.getElementById("homeScreen").classList.remove("hidden");
            document.getElementById("courseDetailScreen").classList.add("hidden");
            document.getElementById("quizContainer").classList.add("hidden");
            document.getElementById("resultContainer").classList.add("hidden");
        }

        function openCourseDetail(courseId) {
            const ders = veriTabani.find(d => d.id === courseId);
            if(!ders || ders.sorular.length === 0) {
                alert("Bu derse henüz soru eklenmemiş! Soru eklediğinizde açılacaktır.");
                return;
            }
            selectedCourseId = courseId;
            document.getElementById("detailCourseTitle").innerText = ders.dersAdi;

            const dersIds = new Set(ders.sorular.map(q => q.id));
            document.getElementById("courseFavCount").innerText = favorites.filter(q => dersIds.has(q.id)).length;
            document.getElementById("courseWrongCount").innerText = wrongAnswers.filter(q => dersIds.has(q.id)).length;

            document.getElementById("homeScreen").classList.add("hidden");
            document.getElementById("courseDetailScreen").classList.remove("hidden");
        }

        function setQuestionCount(count) {
            selectedQuestionCount = count;
            ['5', '10', '20', 'All'].forEach(c => {
                const btn = document.getElementById(`btnCount${c}`);
                if(btn) {
                    btn.className = "flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition";
                }
            });
            const activeBtn = document.getElementById(`btnCount${count === 'all' ? 'All' : count}`);
            if(activeBtn) {
                activeBtn.className = "flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-200 transition";
            }
        }

        function startSelectedCourseQuiz() {
            const ders = veriTabani.find(d => d.id === selectedCourseId);
            let pool = [...ders.sorular].sort(() => Math.random() - 0.5);

            if(selectedQuestionCount !== 'all' && pool.length > selectedQuestionCount) {
                pool = pool.slice(0, selectedQuestionCount);
            }

            activeQuestions = pool;
            beginQuiz();
        }

        function startDenemeSinavi() {
            let tumSorular = [];
            veriTabani.forEach(ders => {
                if (ders.sorular.length === 0) return;
                const pool = [...ders.sorular].sort(() => Math.random() - 0.5);
                const alinacak = Math.min(ders.sinavSoruSayisi, pool.length);
                tumSorular.push(...pool.slice(0, alinacak));
            });
            if(tumSorular.length === 0) { alert("Sistemde henüz hiç soru bulunmuyor!"); return; }
            
            activeQuestions = tumSorular.sort(() => Math.random() - 0.5);
            beginQuiz();
        }

        function openGlobalFavorites() {
            if(favorites.length === 0) { alert("Favori soru yok!"); return; }
            activeQuestions = [...favorites];
            beginQuiz();
        }

        function openGlobalWrongs() {
            if(wrongAnswers.length === 0) { alert("Yanlış yapılan soru yok!"); return; }
            activeQuestions = [...wrongAnswers];
            beginQuiz();
        }

        function openCourseFavorites() {
            const ders = veriTabani.find(d => d.id === selectedCourseId);
            const dersIds = new Set(ders.sorular.map(q => q.id));
            const dersFavs = favorites.filter(q => dersIds.has(q.id));
            if(dersFavs.length === 0) { alert("Bu derse ait favori soru yok!"); return; }
            activeQuestions = dersFavs;
            beginQuiz();
        }

        function openCourseWrongs() {
            const ders = veriTabani.find(d => d.id === selectedCourseId);
            const dersIds = new Set(ders.sorular.map(q => q.id));
            const dersWrongs = wrongAnswers.filter(q => dersIds.has(q.id));
            if(dersWrongs.length === 0) { alert("Bu derse ait yanlış yapılan soru yok!"); return; }
            activeQuestions = dersWrongs;
            beginQuiz();
        }

        function beginQuiz() {
            currentIndex = 0;
            score = 0;
            wrongCountScore = 0;
            document.getElementById("homeScreen").classList.add("hidden");
            document.getElementById("courseDetailScreen").classList.add("hidden");
            document.getElementById("quizContainer").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuestions[currentIndex];
            document.getElementById("questionNumber").innerText = `Soru ${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById("questionText").innerText = q.soruMetni;
            correctAnswerText = q.dogruCevap;

            let allOptions = [q.dogruCevap, ...q.yanlisCevaplar];
            currentShuffledOptions = allOptions.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            const harfler = ["A", "B", "C", "D", "E"];
            currentShuffledOptions.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition font-medium flex items-center justify-between text-xs";
                btn.innerHTML = `<span class="bg-slate-100 w-6 h-6 rounded-lg flex items-center justify-center font-bold text-slate-600 mr-3 shrink-0">${harfler[index]}</span> <span class="flex-1">${option}</span>`;
                btn.dataset.optionText = option;
                btn.onclick = () => checkAnswer(option, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById("explanationContainer").classList.add("hidden");
            document.getElementById("nextBtn").classList.add("hidden");
            updateFavButtonUI();
        }

        function checkAnswer(selectedOption, selectedBtn) {
            const allBtns = document.getElementById("optionsContainer").getElementsByTagName("button");
            const currentQ = activeQuestions[currentIndex];
            
            for (let btn of allBtns) {
                btn.disabled = true;
                if (btn.dataset.optionText === correctAnswerText) {
                    btn.classList.add("bg-green-100", "border-green-500", "text-green-800");
                }
            }

            if (selectedOption === correctAnswerText) {
                score++;
                wrongAnswers = wrongAnswers.filter(item => item.id !== currentQ.id);
            } else {
                wrongCountScore++;
                selectedBtn.classList.add("bg-red-100", "border-red-500", "text-red-800");
                if(!wrongAnswers.some(item => item.id === currentQ.id)) { wrongAnswers.push(currentQ); }
            }

            updateGlobalCounts();

            if(currentQ.aciklama) {
                document.getElementById("explanationText").innerText = currentQ.aciklama;
                document.getElementById("explanationContainer").classList.remove("hidden");
            }

            document.getElementById("nextBtn").classList.remove("hidden");
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById("quizContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                
                // Karne İstatistikleri
                document.getElementById("resTrue").innerText = score;
                document.getElementById("resFalse").innerText = wrongCountScore;
                const successRate = Math.round((score / activeQuestions.length) * 100);
                document.getElementById("resSuccess").innerText = `%${successRate}`;
            }
        }

        function toggleFavorite() {
            const q = activeQuestions[currentIndex];
            const exists = favorites.some(item => item.id === q.id);
            if (exists) {
                favorites = favorites.filter(item => item.id !== q.id);
            } else {
                favorites.push(q);
            }
            updateGlobalCounts();
            updateFavButtonUI();
        }

        function updateFavButtonUI() {
            const q = activeQuestions[currentIndex];
            const favBtn = document.getElementById("favBtn");
            const isFav = favorites.some(item => item.id === q.id);
            if (isFav) {
                favBtn.classList.remove("text-gray-300");
                favBtn.classList.add("text-yellow-500");
            } else {
                favBtn.classList.add("text-gray-300");
                favBtn.classList.remove("text-yellow-500");
            }
        }

        function goHome() {
            initHome();
        }

        initHome();
    </script>
