<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçişleri GYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Üst Menü -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-md font-bold cursor-pointer" onclick="goHome()">📚Soru Bankası</h1>
        <div class="text-xs flex gap-2">
            <button onclick="openGlobalFavorites()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-full transition">⭐ Favoriler (<span id="favCount">0</span>)</button>
            <button onclick="openGlobalWrongs()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-full transition">❌ Yanlışlar (<span id="wrongCount">0</span>)</button>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center">
        
        <!-- 1. ANA EKRAN -->
        <div id="homeScreen" class="space-y-4 my-4">
            <div class="bg-gradient-to-r from-orange-500 to-amber-500 p-5 rounded-2xl shadow-md text-white text-center cursor-pointer hover:opacity-95 transition" onclick="startDenemeSinavi()">
                <h2 class="text-xl font-bold">🎯 Deneme Sınavı</h2>
                <p class="text-xs mt-1 text-orange-100">Havuzdaki Sorularla Deneme</p>
            </div>

            <h2 class="text-base font-bold text-slate-700 mt-4 mb-2">Ders Seçerek Çalış (21 Kalem):</h2>
            <div id="courseList" class="space-y-2 pb-10"></div>
        </div>

        <!-- 2. DERS DETAY / MENÜ EKRANI -->
        <div id="courseDetailScreen" class="bg-white rounded-2xl shadow-xl p-6 hidden my-4 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <button onclick="goHome()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 font-medium hover:bg-slate-200">🏠 Ana Sayfa</button>
                <h2 id="detailCourseTitle" class="text-sm font-bold text-blue-600 text-right">Ders Adı</h2>
            </div>

            <div class="space-y-3 py-2">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="block text-xs font-bold text-slate-700 mb-2">Çözmek İstediğin Soru Adedini Seç:</label>
                    <div class="flex gap-2 mb-3">
                        <button onclick="setQuestionCount(5)" id="btnCount5" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-200 transition">5 Soru</button>
                        <button onclick="setQuestionCount(10)" id="btnCount10" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition">10 Soru</button>
                        <button onclick="setQuestionCount(20)" id="btnCount20" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition">20 Soru</button>
                        <button onclick="setQuestionCount('all')" id="btnCountAll" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition">Tümü</button>
                    </div>
                    <button onclick="startSelectedCourseQuiz()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition text-sm">▶️ Testi Başlat</button>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="openCourseFavorites()" class="p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-xs font-semibold hover:bg-amber-100 transition flex items-center justify-center gap-1">
                        ⭐ Dersin Favorileri (<span id="courseFavCount">0</span>)
                    </button>
                    <button onclick="openCourseWrongs()" class="p-3 bg-red-50 border border-red-200 text-red-800 rounded-xl text-xs font-semibold hover:bg-red-100 transition flex items-center justify-center gap-1">
                        ❌ Dersin Yanlışları (<span id="courseWrongCount">0</span>)
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. SORU ÇÖZÜM EKRANI -->
        <div id="quizContainer" class="bg-white rounded-2xl shadow-xl p-6 relative hidden my-4">
            <div class="flex justify-between items-center mb-4">
                <button onclick="goHome()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 font-medium hover:bg-slate-200">🏠 Çıkış</button>
                <div class="flex items-center space-x-2">
                    <span id="questionNumber" class="text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Soru 1/1</span>
                    <button onclick="toggleFavorite()" id="favBtn" class="text-2xl text-gray-300 hover:text-yellow-500 transition">⭐</button>
                </div>
            </div>

            <!-- Soru Metni -->
            <h2 id="questionText" class="text-base font-medium mb-4">Soru metni yükleniyor...</h2>

            <!-- Şıklar (A, B, C, D, E) -->
            <div id="optionsContainer" class="space-y-3"></div>

            <!-- Açıklama Alanı -->
            <div id="explanationContainer" class="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-600 hidden">
                <span class="font-bold text-blue-600 block mb-1">💡 Açıklama:</span>
                <p id="explanationText"></p>
            </div>

            <!-- Sonraki Soru Butonu -->
            <button id="nextBtn" onclick="nextQuestion()" class="mt-6 w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hidden hover:bg-blue-700 transition text-sm">Sonraki Soru ➡️</button>
        </div>

        <!-- 4. DETAYLI BİTİŞ / KARNE EKRANI -->
        <div id="resultContainer" class="bg-white rounded-2xl shadow-xl p-6 text-center hidden my-4 space-y-4">
            <h2 class="text-2xl font-bold text-blue-600">Sınav / Test Tamamlandı! 🎉</h2>
            
            <div class="grid grid-cols-3 gap-2 py-3">
                <div class="bg-green-50 p-3 rounded-xl border border-green-200">
                    <span class="block text-[11px] text-green-600 font-bold">DOĞRU</span>
                    <span id="resTrue" class="text-lg font-bold text-green-700">0</span>
                </div>
                <div class="bg-red-50 p-3 rounded-xl border border-red-200">
                    <span class="block text-[11px] text-red-600 font-bold">YANLIŞ</span>
                    <span id="resFalse" class="text-lg font-bold text-red-700">0</span>
                </div>
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-200">
                    <span class="block text-[11px] text-blue-600 font-bold">BAŞARI</span>
                    <span id="resSuccess" class="text-lg font-bold text-blue-700">%0</span>
                </div>
            </div>

            <button onclick="goHome()" class="w-full bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold hover:bg-blue-700 transition text-sm">Ana Sayfaya Dön</button>
        </div>

    </main>

                    {"id": "bilgiedinme_44", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, elektronik ortamdan yapılan başvuruların geçerli sayılabilmesi için aşağıdaki koşullardan hangisinin sağlanması zorunludur?", "dogruCevap": "Başvuru yapan kişinin kimliği ile yazının kaynağının yasal yollarla tespit edilebilir nitelikte olması", "yanlisCevaplar": ["Başvuru sahibinin kimliğinin noter huzurunda onaylanmış olması ve taahhütname sunulması", "Başvuruya biyometrik doğrulama sistemiyle kimlik eşleştirmesi yapılması", "Sadece başvuru sahibine ait e-posta adresinin bildirilmiş olması", "El ile atılmış ıslak imzanın taranarak gönderilmesi ve noter tasdikli örneğiyle sunulması"]},
                    {"id": "bilgiedinme_45", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu uyarınca, bilgi edinme başvurusunda bulunan kişinin dilekçesinde yer alması gereken zorunlu unsur aşağıdakilerden hangisidir?", "dogruCevap": "Erişilmek istenen bilgi veya belgelerin açık ve belirli şekilde tanımlanması", "yanlisCevaplar": ["Talep edilen bilgiyle ilgili kişisel değerlendirmeler ve şikâyet gerekçeleri", "Başvuru yapılan kurumun genel görev alanı ve organizasyon şeması", "Bilgi talebinin dayandığı kanaat ve başvuru sahibinin kişisel görüşleri", "Genel ve belirsiz ifadelerle sıralanmış konu başlıkları"]},
                    {"id": "bilgiedinme_46", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu kapsamında bir başvurunun işleme alınabilmesi için aşağıdaki şartlardan hangisinin sağlanması zorunlu değildir?", "dogruCevap": "Başvuru sahibinin ikamet ettiği ilin valiliğine başvuru yapılması", "yanlisCevaplar": ["Başvuru sahibinin açık kimlik bilgilerine yer verilmesi", "Talep edilen bilgi veya belgenin somut biçimde belirtilmesi", "Gerçek kişi ise imza, tüzel kişi ise yetki belgesi sunulması", "Oturma yeri veya iş adresinin dilekçede yazılması"]},
                    {"id": "bilgiedinme_47", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu uyarınca elektronik ortamda yapılan başvurularda, başvuru sahibinin kimliğinin tespit edilebilir olması aşağıdakilerden hangisi açısından temel bir gerekliliktir?", "dogruCevap": "Başvuru sahibinin kimliğinin ve beyanın kaynağının yasal olarak doğrulanabilir olması için", "yanlisCevaplar": ["Talep edilen bilginin yalnızca kurum arşivlerine kaydedilmesi için", "Başvuru sürecinin usulen şekli bir zorunluluk taşıması için", "Talep edilen bilginin kamuya açıklanma durumunun değerlendirilmesi için", "Kurumun başvuruyu işlem sırasında üçüncü kişilerle paylaşabilmesi için"]},
                    {"id": "bilgiedinme_48", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme başvuruları hangi iletişim yöntemleriyle yapılabilir?", "dogruCevap": "Yazılı başvurulara ek olarak, kimliğin tespiti sağlandığı sürece elektronik ortam ve diğer iletişim araçlarıyla", "yanlisCevaplar": ["Yalnızca elden teslim edilen fiziki dilekçelerle", "Yalnızca noter onaylı taahhütlü dilekçelerle", "Sadece e-Devlet kapısı üzerinden yapılan başvurularla", "Kurumun özel arşiv birimlerine bizzat başvuru yapılması şartıyla"]},
                    {"id": "bilgiedinme_49", "soruMetni": "I. Talep edilen bilgi veya belgenin açık ve belirli şekilde ifade edilmesi\nII. Başvuru sahibinin medeni hali ve ailevi durumu\nIII. Bilgi talebinin gerekçelendirilmesi ya da kişisel yoruma dayalı açıklamalar yapılması\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, buna göre yukarıdaki ifadelerden hangileri, dilekçede yer alması gereken zorunlu unsurlar arasında yer alır?", "dogruCevap": "Yalnız I", "yanlisCevaplar": ["I ve II", "I ve III", "II ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_50", "soruMetni": "I. Tüzel kişinin unvanı ve açık adresi dilekçede yer almalıdır.\nII. Başvuru dilekçesine yetkili kişinin imzası ve bu yetkisini gösteren belge eklenmelidir.\nIII. Şirket ortaklarının listesi ve vergi levhası da dilekçeye eklenmelidir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, tüzel kişiliğe sahip başvuru sahipleri tarafından yapılan bilgi edinme taleplerinde, başvurunun geçerli sayılması için belirli unsurların dilekçede yer alması zorunludur. Buna göre, yukarıdaki ifadelerden hangileri bilgi edinme başvurusunda zorunlu olan unsurlardandır?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "I ve III", "II ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_51", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, elektronik ortamda yapılan başvurularla ilgili olarak hangisi yanlıştır?", "dogruCevap": "Sözlü başvuru yapılabilir.", "yanlisCevaplar": ["E-imza kullanımı mümkündür.", "Başvuruda kimliğin tespiti önemlidir.", "Diğer iletişim araçlarıyla da başvuru yapılabilir.", "Yazının kimden neşet ettiği belirlenmelidir."]},
                    {"id": "bilgiedinme_52", "soruMetni": "I. Başvuru sahibinin talep ettiği bilgi veya belge açık ve somut biçimde ifade edilmelidir.\nII. Bilgiye neden ihtiyaç duyulduğunun gerekçelendirilmesi zorunludur.\nIII. Kişisel değerlendirme, görüş ve yorumlara dilekçede mutlaka yer verilmelidir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yapılan başvuruların dilekçelerinde belirli unsurların dilekçede yer alması zorunludur. Buna göre, yukarıdaki ifadelerden hangileri bilgi edinme başvurusunda zorunlu olan unsurlardandır?", "dogruCevap": "Yalnız I", "yanlisCevaplar": ["I ve II", "I ve III", "II ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_53", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, elektronik ortamda yapılan başvuruların geçerli sayılabilmesi için bazı asgari koşulların sağlanması gerekir. Aşağıdaki ifadelerden hangisi, bu koşulların sağlanmaması hâlinde başvurunun geçersiz sayılmasına neden olur?", "dogruCevap": "Başvuru sahibinin kimliği ya da yazının kaynağının yasal olarak tespit edilememesi", "yanlisCevaplar": ["Başvurunun e-Devlet gibi doğrulanabilir dijital platformlar üzerinden yapılması", "Talep edilen bilgi veya belgenin başvuru metninde açık şekilde belirtilmiş olması", "Başvuruda imzanın elektronik ortamda, dijital araçlarla beyan edilmiş olması", "Başvurunun bir kamu kurumunun resmi e-posta adresine iletilmesi"]},
                    {"id": "bilgiedinme_54", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre yapılan başvurularda, dilekçede istenen bilgi veya belgenin somut olarak belirtilmesi yasal zorunluluktur. Aşağıdakilerden hangisinin başvuru dilekçesinde bulunması, talebin belirsiz ve geçersiz sayılmasına neden olabilir?", "dogruCevap": "Talep edilen bilgiye ilişkin varsayıma dayalı, genel ve muğlak bir tanımın yapılması", "yanlisCevaplar": ["Başvurunun, daha önce yapılan benzer bir talebe atıfla sunulması", "İlgili belgeye dair kamu kaynağında yer alan bir referansın eklenmesi", "Aynı konuda daha önce yapılan başvurunun tarih ve sonuç bilgilerinin sunulması", "Bilgi edinme hakkının kullanım gerekçesinin açıklanması"]},
                    {"id": "bilgiedinme_55", "soruMetni": "Bilgi edinme başvurusu, başvuru sahibinin adı ve soyadı, imzası, ________ veya iş adresini, başvuru sahibi tüzel kişi ise tüzel kişinin unvanı ve adresi ile yetkili kişinin imzasını ve yetki belgesini içeren dilekçe ile istenen bilgi veya belgenin bulunduğu kurum veya kuruluşa yapılır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "Oturma yeri", "yanlisCevaplar": ["Uyruk bilgisi", "telefon numarası", "kimlik fotokopisi", "nüfus bilgisi"]},
                    {"id": "bilgiedinme_56", "soruMetni": "Bilgi edinme başvurusu, başvuru sahibinin adı ve soyadı, imzası, oturma yeri veya iş adresini, başvuru sahibi tüzel kişi ise ile yetkili kişinin imzasını, …………... ve yetki belgesini içeren dilekçe ile istenen bilgi veya belgenin bulunduğu kurum veya kuruluşa yapılır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "tüzel kişinin unvanı ve adresi", "yanlisCevaplar": ["Vergi kimlik numarası", "noter onayı", "Şirket ortakları", "iletişim formu"]},
                    {"id": "bilgiedinme_57", "soruMetni": "Bilgi edinme başvurusu, kişinin kimliğinin ve imzasının veya yazının ________ tespitine yarayacak başka bilgilerin yasal olarak belirlenebilir olması kaydıyla elektronik ortamda veya diğer iletişim araçlarıyla da yapılabilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "kimden neşet ettiğinin", "yanlisCevaplar": ["başvuru tarihi ve saatinin", "kanuni dayanağının", "kurumsal kaynağının", "Usule uygunluğunun"]},
                    {"id": "bilgiedinme_58", "soruMetni": "Bilgi edinme başvurusu, kişinin kimliğinin ve imzasının veya yazının kimden neşet ettiğinin tespitine yarayacak başka bilgilerin olması kaydıyla elektronik ortamda veya ________ diğer iletişim araçlarıyla da yapılabilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "yasal olarak belirlenebilir", "yanlisCevaplar": ["kamuya açık şekilde paylaşılmış", "noter tasdikiyle belgelenmiş", "kurum onayıyla mühürlenmiş", "fiziki ortamda arşivlenmiş"]},
                    {"id": "bilgiedinme_59", "soruMetni": "Bilgi edinme başvuru dilekçesinde, ________ açıkça belirtilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "istenen bilgi veya belgeler", "yanlisCevaplar": ["bilgi edinme gerekçesi", "başvuru sahibiyle ilgili kişisel bilgiler", "kurumun görev alanı", "daha önceki başvuruların sonucu"]},
                    {"id": "bilgiedinme_60", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme başvurusu aşağıdaki bilgi türlerinden hangisini konu edinmişse, başvuru işleme alınabilir ve değerlendirmeye tabi tutulur?", "dogruCevap": "Başvurulan kamu kurumunun görev tanımı kapsamında olan ve fiilen elinde bulunması gereken bilgi veya belgeler", "yanlisCevaplar": ["Kurum personelinin kişisel hesaplarında yer alan, kurumsal faaliyetle ilgisi bulunmayan elektronik yazışmalar", "Kurumun yetki ve görev alanı dışında kalan, başka bir idarenin faaliyet sahasına giren belgeler", "Sadece yüksek gizlilik derecesiyle sınıflandırılmış ve kamuya kapalı olarak hazırlanan stratejik raporlar", "Sosyal medya, basın ve üçüncü taraf kaynaklarda yayımlanmış kamuya açık genel içerikler"]},
                    {"id": "bilgiedinme_61", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre;\nI. İstenen bilgi veya belge, başvurulan kurum ve kuruluştan başka bir yerde bulunuyorsa, başvuru dilekçesi bu kurum ve kuruluşa gönderilir ve durum ilgiliye yazılı olarak bildirilir.\nII. Bilgi edinme başvurusu, başvurulan kurum ve kuruluşların ellerinde bulunan veya görevleri gereği bulunması gereken bilgi veya belgelere ilişkin olmalıdır.\nIII.Kurum ve kuruluşlar, ayrı veya özel bir çalışma, araştırma, inceleme ya da analiz neticesinde oluşturulabilecek türden bir bilgi veya belge için yapılacak başvurulara olumsuz cevap verebilirler.\nİstenecek bilgi veya belgenin niteliği ile ilgili yukarıda verilen bilgilerden hangileri doğrudur?", "dogruCevap": "I, II ve III", "yanlisCevaplar": ["Yalnız I", "II ve III", "I ve II", "I ve III"]},
                    {"id": "bilgiedinme_62", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu kapsamında yapılan başvurularda, aşağıdaki bilgi türlerinden hangisi, başvuruya konu edilebilecek nitelikte ve kurum tarafından karşılanabilir bir içerik olarak kabul edilir?", "dogruCevap": "Başvurulan kamu kurumunun görev alanına giren ve halihazırda fiziki ya da dijital ortamda mevcut bulunan belgeler", "yanlisCevaplar": ["Kurumun görev sınırlarının dışında kalan ve başka idarelerin yetki alanına giren konulara ilişkin belgeler", "Kurum tarafından henüz oluşturulmamış; analiz, değerlendirme veya geleceğe yönelik tahmine dayalı rapor taslakları", "Üçüncü kişilerin mahremiyetini ilgilendiren, özel hayatın gizliliği kapsamındaki kişisel veri içerikleri", "Kurum personelinin bireysel değerlendirme ve kanaatlerine dayalı kişisel yorum ve notları"]},
                    {"id": "bilgiedinme_63", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, başvurulan kurumun elinde bulunmayan ve görev alanına da girmeyen bir bilgi veya belgeye ilişkin başvuru yapıldığında, aşağıdakilerden hangi işlem yapılır?", "dogruCevap": "Dilekçe, bilginin bulunduğu yetkili kuruma gönderilir ve bu yönlendirme süreci başvuru sahibine yazılı olarak bildirilir.", "yanlisCevaplar": ["Talep edilen bilgi “kamuya açık değil” gerekçesiyle arşive kaldırılır ve işlem yapılmaz.", "Başvuru, bilgi eksikliği nedeniyle doğrudan reddedilir ve başvuru sahibine herhangi bir bildirim yapılmaz.", "Başvuru, talebin içeriği değiştirilerek kurumun görev alanına uydurulur.", "Talep, kuruma ait olmasa dahi değerlendirmeye alınır ve bilgi üretimi için yeni bir iç yazışma başlatılır."]},
                    {"id": "bilgiedinme_64", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, başvurulan kurumun elinde mevcut olmayan ve ancak ayrıca özel bir analiz, araştırma veya teknik çalışma ile üretilebilecek bir bilgiye ilişkin başvuru yapılması hâlinde kurumun yanıtı ne olabilir?", "dogruCevap": "Kurum, bu tür verileri üretme yükümlülüğü altında olmadığından, başvuruya olumsuz yanıt verebilir.", "yanlisCevaplar": ["Talep edilen bilgi, kurum dışı kaynaklardan temin edilerek başvuru sahibine özet biçiminde sunulur.", "Başvuru konusu, kamu hizmeti niteliği taşıdığından, ilgili bakanlığa yönlendirilerek cevaplandırılır.", "Kurum, veri üretim yükümlülüğü kapsamında bilginin analizini yaparak makul süre içinde yanıt verir.", "Talep, kamu yararı gerekçesiyle bilgi edinme kurulu tarafından doğrudan değerlendirilir ve karara bağlanır."]},
                    {"id": "bilgiedinme_65", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme başvurusunda talep edilen içerik, başvurulan kurumun yetki ve görev alanı dışında kalan bir bilgiye ilişkinse, söz konusu talep ile ilgili olarak kurum tarafından nasıl bir işlem tesis edilir?", "dogruCevap": "Başvuru, kurumun görev kapsamına girmediği için dilekçe ilgili kuruma gönderilir ve bu durum başvuru sahibine yazılı olarak bildirilir.", "yanlisCevaplar": ["Talep edilen bilgi, yetki sınırı gözetilmeksizin bilgi edinme hakkının kapsamı gereği kısmen açıklanır.", "Talebin konusu, kamuoyunun ilgisini çekmesi hâlinde resen cevaplandırılır ve başvuru sahibine ücret tahakkuk ettirilir.", "Bilginin doğruluğu garanti edilmeksizin, başvuru sahibine kurum dışı kaynak önerilir.", "Talep, öncelikle üst makamın onayı alındıktan sonra Bilgi Edinme Kurulu'na havale edilir."]},
                    {"id": "bilgiedinme_66", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu uyarınca, kurumların yalnızca ellerinde bulunan ya da görevleri gereği bulunması gereken bilgi ve belgeleri sağlama yükümlülüğü vardır. Bu çerçevede, aşağıdakilerden hangisi kurum tarafından doğrudan ve hazır biçimde temin edilmesi mümkün olmayan, yani başvuruya olumsuz yanıt verilebilecek bir bilgi türüdür?", "dogruCevap": "Ancak kurum tarafından ayrıca bir teknik analiz, inceleme ya da özel çalışma ile üretilebilecek bilgi içerikleri", "yanlisCevaplar": ["İlgili kamu kurumunun görev sahası içinde yer alan ve istatistiki yöntemlerle hazırlanmış mevcut veriler", "Mevzuat gereği kişisel verileri içermekle birlikte belirli koşullarda erişilebilen personel özlük bilgileri", "Kurumun arşivinde bulunan, geçmiş denetim süreçlerine dair düzenlenmiş rapor örnekleri", "İlgili kuruma ait ve yönetmelik eki olarak resmi yazışmalarla yayımlanmış iç düzenleyici belgeler"]},
                    {"id": "bilgiedinme_67", "soruMetni": "Kurum ve kuruluşlarca ________ , bilgi edinme başvurularına konu olamaz. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "yayımlanmış veya yayın, broşür, ilân ve benzeri yollarla kamuya açıklanmış bilgi veya belgeler,", "yanlisCevaplar": ["başvurulan kurum ve kuruluşların ellerinde bulunan belgeler", "Başvuru sahibinin hak sahibi olduğu taşınmaza ilişkin bilgiler,", "Kurumun başvuru sahibini etkileyen kararlar,", "İlgili idarenin resmi kayıtlarında istatistiksel modellemeler,"]},
                    {"id": "bilgiedinme_68", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bir başvuru sahibi, daha önce kamuya açıklanmış bir bilgi ya da belgeyi tekrar talep ettiğinde, ilgili kurumun bu başvuru karşısındaki yükümlülüğü aşağıdakilerden hangisidir?", "dogruCevap": "Söz konusu bilginin veya belgenin hangi tarihte, hangi ortamda ve hangi araçla yayımlandığını başvuru sahibine açıkça bildirmek", "yanlisCevaplar": ["Talep edilen tüm belgelerin çıktısını alarak fiziksel olarak teslim etmek", "Bilgi zaten kamuya açık olduğu için herhangi bir açıklama yapmadan talebi reddetmek", "Talep edilen içeriği başvuru sahibine noter onaylı vermek", "Talep edilen içeriği başvuru sahibine yeniden oluşturulmuş bir formatta sunmak"]},
                    {"id": "bilgiedinme_69", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre aşağıdakilerden hangisi, kamuya açıklanmış veya yayımlanmış bilgi veya belge kapsamında değerlendirilemez ve dolayısıyla bilgi edinme başvurularına konu edilebilir?", "dogruCevap": "Kurum içi birimlerin erişimine açık olan yazışma metinleri", "yanlisCevaplar": ["Resmi Gazete'de yayımlanarak yürürlüğe giren ve kamuoyuyla paylaşılan düzenleyici işlemler", "Kurumun basın danışmanlığı birimi tarafından medyaya servis edilen faaliyet duyuruları", "Kurumun resmi web sitesinde erişime açılmış kamu bilgilendirme içerikleri", "Vatandaşlara dağıtılmış ve kamusal nitelik taşıyan tanıtım broşürleri"]},
                    {"id": "bilgiedinme_70", "soruMetni": "Kurum ve kuruluşlarca yayımlanmış veya yayın, broşür, ilân ve benzeri yollarla kamuya açıklanmış bilgi veya belgeler, bilgi edinme başvurularına konu olamaz. Ancak, yayımlanmış veya kamuya açıklanmış bilgi veya belgelerin ________ : ________ ve ________  yayımlandığı veya açıklandığı başvurana bildirilir 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "ne şekilde, ne zaman ve nerede", "yanlisCevaplar": ["yöntem, tarih ve içerik", "kaynak, erişim süresi ve açıklama şekli", "başvuru şekli, dağıtım alanı ve metin türü", "nasıl, kim tarafından ve kimlere"]},
                    {"id": "bilgiedinme_71", "soruMetni": "I. Kurumların yayımlanmış bilgileri tekrar üretme yükümlülüğü yoktur.\nII. Kamuya açıklanmış bilgi ve belgeler bilgi edinme başvurusuna konu olabilir.\nIII. Kurumlar, yayımlanma bilgilerini başvurana iletmek zorundadır.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangileri doğrudur?", "dogruCevap": "I ve III", "yanlisCevaplar": ["Yalnız I", "II ve III", "Yalnız II", "I, II ve III"]},

                    {"id": "bilgiedinme_73", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, gizlilik dereceli bilgi ile açıklanabilir bilgi aynı belgede yer aldığında uygulanacak işlemlerden biridir?", "dogruCevap": "Gizli bilgiler ayıklanarak kalan kısmın başvurana sunulması", "yanlisCevaplar": ["Belgenin tamamının imha edilmesi", "Başvurunun derhal reddedilmesi", "Bilginin tamamının üst makama sunulması", "Bilginin yalnızca dava açılması hâlinde açıklanması"]},
                    {"id": "bilgiedinme_74", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, kurum ve kuruluşlar, bilgi edinme başvurusu üzerine ayırt edilebilen gizli bilgileri çıkararak belgeyi sunmuşsa aşağıdakilerden hangisi doğrudur?", "dogruCevap": "Gizli kısmın çıkarılma nedeni yazılı olarak açıklanır.", "yanlisCevaplar": ["Başvuru otomatik olarak süresiz askıya alınır.", "Başvuran, sadece dilekçe yoluyla bilgi alabilir.", "Bilginin tamamı kamuya açıklanır.", "Açıklanan bilgiye erişim yalnızca dava sürecinde mümkündür."]},

                    {"id": "bilgiedinme_76", "soruMetni": "Bilgi veya belgede gizli kısımlar çıkarıldıktan sonra kalan bilgiler başvurana verilir ve ________ gerekçesi başvurana yazılı olarak bildirilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "ayırma", "yanlisCevaplar": ["temin", "açıklama", "gizlilik", "Saklama"]},

                    {"id": "bilgiedinme_82", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi veya belgenin niteliği gereği kopyasının verilmesinin mümkün olmadığı hâllerde, özellikle görüntü kaydı şeklindeki bilgi veya belgeler için başvuru sahibine erişim nasıl sağlanır?", "dogruCevap": "Başvuru sahibinin belgeyi doğrudan izleyebilmesine izin verilir.", "yanlisCevaplar": ["Görüntü dosyasının fiziksel kopyası çıkarılarak başvuru sahibine teslim edilir.", "Görüntü belgesi yazıya dökülerek başvuru sahibine sunulur.", "Belgenin içerdiği görsellerin yalnızca açıklamaları paylaşılır.", "Belgeye yalnızca kurum personelinin gözetiminde fotoğraf çekme hakkı tanınır."]},
                    {"id": "bilgiedinme_83", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, ses kaydı niteliğindeki bilgi veya belgelere yapılan bilgi edinme başvurularında, belge kopyasının verilmesi mümkün değilse kurumlar aşağıdakilerden hangisini sağlamakla yükümlüdür?", "dogruCevap": "Ses kaydının doğrudan dinlenmesine imkân tanınması", "yanlisCevaplar": ["Ses kaydının çözümünün yapılıp başvuru sahibine yazılı metin olarak verilmesi", "Talebin reddedilerek gerekçe bildirilmeksizin işlem yapılmaması", "Kayıtların zorunlu olarak CD ortamında kopyalanarak gönderilmesi", "Sadece yargı sürecinde açıklanabilecek şekilde arşivde saklanması"]},

                    {"id": "bilgiedinme_86", "soruMetni": "Başvurunun yapıldığı kurum ve kuruluş, erişimine olanak sağladığı bilgi veya belgeler için başvuru sahibinden erişimin gerektirdiği kadar bir ücreti bütçeye gelir kaydedilmek üzere tahsil edebilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "maliyet tutarı", "yanlisCevaplar": ["hizmet bedeli", "işlem vergisi", "Saklama bedeli", "taşıma ücreti"]},

                    {"id": "bilgiedinme_90", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi veya belgelere erişim için gereken maliyetin başvuru sahibine bildirilmesi durumunda aşağıdakilerden hangisi gerçekleşir?", "dogruCevap": "15 iş günlük süre kesilir.", "yanlisCevaplar": ["Süre işlemeye devam eder.", "Başvuru otomatik olarak reddedilir.", "Talep iptal edilir.", "Kurum yeni başvuru ister."]},

                    {"id": "bilgiedinme_96", "soruMetni": "I. Kurumlar, bilgi edinme başvurusunu reddederse gerekçe belirtmek zorundadır.\nII. Red kararlarında, başvuru yolları açıkça gösterilmelidir.\nIII. Kurum, cevapları sadece yazılı olarak vermekle yükümlüdür.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangileri doğrudur?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "II ve III", "I ve III", "I, II ve III"]},

                    {"id": "bilgiedinme_101", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme başvurusu reddedilen kişi, kararın tebliğinden itibaren 15 gün içinde yargı yoluna başvurmadan önce hangi adımı atma hakkına sahiptir?", "dogruCevap": "Kurul'a itiraz ederek idari yargı süreci öncesinde kararın yeniden değerlendirilmesini talep etme", "yanlisCevaplar": ["Talep ettiği bilgiye ulaşmak için kurumun tüm arşiv kayıtlarına doğrudan erişim isteme", "Anayasa Mahkemesi'ne doğrudan bireysel başvuru yapma", "Bilgi talebini TBMM Dilekçe Komisyonu'na sevk etme", "Kurumdan üçüncü kişilere ait tüm kişisel bilgileri alma talebinde bulunma"]},
                    {"id": "bilgiedinme_102", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme istemi reddedilen bir başvuru hakkında Kurul inceleme yaparken, ilgili kurumdan bilgi veya belge isteme yetkisine sahiptir. Bu durumda Kurul'un talebine onbeş iş günü içinde cevap verilmemesi hâlinde aşağıdakilerden hangisi hukuken doğru olur?", "dogruCevap": "Kurum, yasal yükümlülüğünü yerine getirmemiş olur.", "yanlisCevaplar": ["Kurul, kurumun kararını otomatik olarak geçersiz sayar.", "Kurum hakkında doğrudan adli yaptırım uygulanır.", "Başvuru sahibine tazminat ödenmesi zorunlu hâle gelir.", "İlgili bilgi veya belge kamuoyuyla paylaşılır."]},
                    {"id": "bilgiedinme_103", "soruMetni": "I. Kurula itiraz, başvuru sahibinin idari yargıya başvurma süresini durdurur.\nII. Kurula başvuru süresi, kararın tebliğinden itibaren 15 gündür.\nIII. Kurulun, başvuruya ilişkin kararını 30 iş günü içinde vermesi gerekir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre bilgi edinme başvurusu reddedilen kişiyle ilgili yukarıdaki değerlendirmelerden hangileri doğrudur?", "dogruCevap": "I, II ve III", "yanlisCevaplar": ["Yalnız I", "I ve II", "II ve III", "Yalnız III"]},

                    {"id": "bilgiedinme_105", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, Bilgi Edinme Değerlendirme Kurulu'na aday gösterilecek kişi grubunda yer almaz?", "dogruCevap": "Üniversite öğrencileri", "yanlisCevaplar": ["Ceza hukuku alanında profesör veya doçentler", "Yargıtay Genel Kurulu'nun önerdiği adaylar", "Türkiye Barolar Birliği tarafından önerilen baro başkanı seçilme yeterliliğine sahip kişiler", "Danıştay Genel Kurulu'nun önerdiği adaylar"]},
                    {"id": "bilgiedinme_106", "soruMetni": "I. Kurula üye seçiminde akademik unvana sahip kişiler yer alabilir.\nII. Kurul seçilecek olan üç üye Türkiye Barolar Birliğinin baro başkanı seçilme yeterliliğine sahip kişiler içinden seçilir.\nIII.Kurul sekiz üyeden oluşur.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Değerlendirme Kurulu hakkında yukarıdakilerden hangileri yanlıştır?", "dogruCevap": "II ve III", "yanlisCevaplar": ["Yalnız II", "Yalnız III", "I ve II", "I, II ve III"]},

                    {"id": "bilgiedinme_112", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu ne zaman toplanır?", "dogruCevap": "Kurul, en az ayda bir defa veya ihtiyaç duyulduğu her zaman Başkanın çağrısı üzerine toplanır.", "yanlisCevaplar": ["Haftalık düzenli toplantı yapılmak zorundadır.", "Yalnızca TBMM çağırırsa toplanır.", "Yıllık plan doğrultusunda yapılır.", "Kurul Başkanı görev süresi dolduğunda toplanır."]},
                    {"id": "bilgiedinme_113", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi Bilgi Edinme Değerlendirme Kurulu üyelerinin görev süresiyle ilgili doğru bir ifadedir?", "dogruCevap": "Görev süresi dört yıldır ve yeniden seçilebilirler.", "yanlisCevaplar": ["Görev süresi beş yıldır, yeniden seçilemezler.", "Üyeler üç yıl görev yapar ve tekrar atanamaz.", "Üyeler ömür boyu atanır.", "Görev süresi Başkan tarafından belirlenir."]},

                    {"id": "bilgiedinme_115", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu'nda yeni Kurul göreve başlayana kadar aşağıdakilerden hangisi geçerlidir?", "dogruCevap": "Yeni Kurul göreve başlayana kadar önceki Kurul görevine devam eder.", "yanlisCevaplar": ["Kurulun faaliyetleri durdurulur.", "Kurul yetkilerini Bilgi Edinme Komisyonu devralır.", "Eski Kurul üyeleri yalnızca danışman sıfatıyla görev yapar.", "Yeni Kurul göreve başlayana kadar başvurular askıya alınır."]},
                    {"id": "bilgiedinme_116", "soruMetni": "Bilgi Edinme Değerlendirme Kurulu, en az ________ veya ihtiyaç duyulduğu her zaman Başkanın çağrısı üzerine toplanır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "ayda bir defa", "yanlisCevaplar": ["yılda bir defa", "Üç ayda bir", "haftada bir", "dönemde bir"]},
                    {"id": "bilgiedinme_117", "soruMetni": "Bilgi Edinme Değerlendirme Kurulu üyelerinin görev süreleri ________ yıldır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "dört", "yanlisCevaplar": ["iki", "Üç", "beş", "bir"]},
                    {"id": "bilgiedinme_118", "soruMetni": "I. Kurul üyeleri dört yıl süreyle görev yapar.\nII. Görev süresi dolmadan ayrılan üyenin yerine gelen üye yeni bir dört yıl için atanır.\nIII. Yeni Kurul göreve başlayıncaya kadar mevcut Kurul görevine devam eder.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu hakkında yukarıdakilerden hangileri doğrudur?", "dogruCevap": "I ve III", "yanlisCevaplar": ["Yalnız I", "II ve III", "Yalnız II", "I, II ve III"]},
                    {"id": "bilgiedinme_119", "soruMetni": "I. Kurul üyelerinin görev süreleri beş yıldır.\nII. Kurul Başkanı, kurul üyelerince kendi aralarından seçilir.\nIII.Kurul, en az yılda bir defa veya ihtiyaç duyulduğu her zaman Başkanın çağrısı üzerine toplanır.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu hakkında yukarıdaki ifadelerden hangileri doğrudur?", "dogruCevap": "Yalnız II", "yanlisCevaplar": ["Yalnız I", "I ve II", "II ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_120", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, Bilgi Edinme Değerlendirme Kurulu üyelerine huzur hakkı ödemesinde dikkate alınmaz?", "dogruCevap": "Kurulun düzenlediği etkinlik sayısı", "yanlisCevaplar": ["Görev yapılan gün sayısı", "Memur aylık katsayısı", "6245 sayılı Harcırah Kanunu", "Damga vergisi oranı"]},
                    {"id": "bilgiedinme_121", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu üyelerine huzur hakkı ödemesi aşağıdaki hangi koşulla sınırlıdır?", "dogruCevap": "Fiilen görev yapılan gün sayısının dördü aşması halinde, aşan günler için huzur hakkı ödenmez.", "yanlisCevaplar": ["Kurul üyelerine her ay en fazla 30 gün için huzur hakkı ödemesi yapılır.", "Kurul ayda en fazla 10 toplantı yapabilir ve her toplantı için ödeme yapılır.", "Görev süresi sona eren Kurul üyelerine bir ay süreyle huzur hakkı ödemesi devam eder.", "Kurul toplantısı başına bir aylık maaş kadar huzur hakkı ödenir."]},
                    {"id": "bilgiedinme_122", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu üyelerine yapılan huzur hakkı ödemesinde aşağıdakilerden hangisi kesinti olarak uygulanır?", "dogruCevap": "Damga vergisi", "yanlisCevaplar": ["Gelir vergisi", "SGK primi", "Emekli keseneği", "Tüm vergiler"]},
                    {"id": "bilgiedinme_123", "soruMetni": "Bilgi Edinme Değerlendirme Kurulu üyelerine, bir ayda fiilen görev yapılan gün sayısının ________ aşması halinde, aşan günler için huzur hakkı ödenmez. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "dördü", "yanlisCevaplar": ["beşi", "altıyı", "yediyi", "Sekizi"]},
                    {"id": "bilgiedinme_124", "soruMetni": "I. Kurul üyelerine huzur hakkı ödemesi yapılırken yalnızca damga vergisi kesintisi yapılır; bunun dışında herhangi bir kesinti uygulanmaz.\nII. Bir ay içinde fiilen görev yapılan gün sayısı dördü aşsa dahi, aşan günler için de huzur hakkı ödenmeye devam edilir.\nIII..Huzur hakkı miktarı, 3000 gösterge rakamı ile memur aylık katsayısı çarpılarak hesaplanır.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu üyelerine yapılan huzur hakkı ödemesiyle ilgili aşağıdaki ifadelerden hangileri doğrudur?", "dogruCevap": "I ve III", "yanlisCevaplar": ["Yalnız I", "II ve III", "I ve II", "I, II ve III"]},
                    {"id": "bilgiedinme_125", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi Bilgi Edinme Değerlendirme Kurulu'nun yetkileri arasında yer alır?", "dogruCevap": "İlgili konularda komisyonlar ve çalışma grupları oluşturma", "yanlisCevaplar": ["Yalnızca TBMM üyeleriyle toplantı yapma", "Bilgi edinme başvurularını yargı sürecine taşıma", "Bilgi edinme taleplerini ihtiyari olarak reddetme", "Bakanlıklar arası müzakere yetkisi ile karar verme"]},
                    {"id": "bilgiedinme_126", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulun toplantılarına kimler davet edilebilir?", "dogruCevap": "İlgili bakanlık, diğer kurum ve kuruluşlar ile STK temsilcileri bilgi almak amacıyla davet edilebilir", "yanlisCevaplar": ["Yalnızca görevdeki hâkimler", "Üniversite öğrencileri ve basın temsilcileri", "Bilgi edinme başvurusunda bulunan vatandaşlar", "Yalnızca kamu tüzel kişilikleri adına atanmış yetkililer"]},
                    {"id": "bilgiedinme_127", "soruMetni": "Bilgi Edinme Değerlendirme Kurulu, gerekli gördüğü takdirde ilgili bakanlık ile diğer kurum ve kuruluşların ve ________ temsilcilerini bilgi almak üzere toplantılarına katılmaya davet edebilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "Sivil toplum örgütlerinin", "yanlisCevaplar": ["Sendika üyelerinin", "basın mensuplarının", "Üniversitelerin", "Siyasi partilerin"]},
                    {"id": "bilgiedinme_128", "soruMetni": "I. Kurul, belirlediği konularda komisyonlar ve çalışma grupları kurabilir.\nII. Kurul, yalnızca kamu kurumlarının temsilcilerini toplantıya çağırabilir.\nIII. Kurul, bilgi almak amacıyla sivil toplum örgütü temsilcilerini de toplantıya davet edebilir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulu hakkında yukarıdaki ifadelerden hangileri doğrudur?", "dogruCevap": "I ve III", "yanlisCevaplar": ["Yalnız I", "II ve III", "Yalnız II", "I, II ve III"]},
                    {"id": "bilgiedinme_129", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulun sekretarya hizmetleri hangi kurum tarafından yürütülür?", "dogruCevap": "Adalet Bakanlığı", "yanlisCevaplar": ["Cumhurbaşkanlığı", "Türkiye Büyük Millet Meclisi", "Danıştay", "Yargıtay"]},
                    {"id": "bilgiedinme_130", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, Bilgi Edinme Değerlendirme Kurulun görev ve çalışma esasları hangi makam tarafından çıkarılan yönetmelikle belirlenir?", "dogruCevap": "Cumhurbaşkanlığı", "yanlisCevaplar": ["Bilgi Edinme Kurulu", "Türkiye Barolar Birliği", "İçişleri Bakanlığı", "Türkiye İnsan Hakları ve Eşitlik Kurumu"]},
                    {"id": "bilgiedinme_131", "soruMetni": "Bilgi Edinme Değerlendirme Kurulun sekretarya hizmetleri ________ tarafından yerine getirilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "Adalet Bakanlığı", "yanlisCevaplar": ["Yargıtay", "Cumhurbaşkanlığı", "Anayasa Mahkemesi", "Türkiye İnsan Hakları Kurumu"]},

                    {"id": "bilgiedinme_134", "soruMetni": "Yargı denetimi dışında kalan idari işlemlerden kişinin ________ ve ________ etkileyecek nitelikte olanlar, Bilgi Edinme Hakkı Kanunu kapsamına dahildir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluklara hangi ifadeler gelmelidir?", "dogruCevap": "Çalışma hayatını — mesleki onurunu", "yanlisCevaplar": ["Özel hayatı — eğitim durumu", "fikir özgürlüğü — aile hayatı", "Sosyal çevresi — kariyer planı", "malvarlığı — vatandaşlık hakkı"]},
                    {"id": "bilgiedinme_135", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi bilgi edinme hakkı kapsamında değerlendirilmez?", "dogruCevap": "Devletin emniyetine açıkça zarar verecek gizlilik dereceli belge", "yanlisCevaplar": ["Bir kamu kurumunun 10 yıl önce yayımladığı yönetmelik", "Toplumu ilgilendiren yargı kararları", "Memur atamalarına ilişkin istatistiki veri", "Belediyenin kamuya duyurduğu proje raporu"]},
                    {"id": "bilgiedinme_136", "soruMetni": "I. Devlet sırrı niteliğindeki belgelerin açıklanması milli güvenliğe zarar verebilir.\nII. Gizlilik dereceli belgeler, sadece kamuoyunun ilgisini çekenrse paylaşılır.\nIII. Devlet sırrı olan belgeler bilgi edinme hakkı kapsamında değerlendirilmez.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki ifadelerden hangileri doğrudur?", "dogruCevap": "I ve III", "yanlisCevaplar": ["Yalnız I", "II ve III", "Yalnız II", "I, II ve III"]},
                    {"id": "bilgiedinme_137", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi bilgi edinme hakkı kapsamında değerlendirilmez?", "dogruCevap": "Devlet sırı niteliğindeki diplomatik yazışmalar", "yanlisCevaplar": ["Kurum içi hizmet içi eğitim planları", "Belediyeye ait bütçe tabloları", "Valilik tarafından yayımlanan genelgeler", "Meclis komisyon tutanakları"]},
                    {"id": "bilgiedinme_138", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi bilgi edinme hakkı sınırlandırılmış bilgiler arasında yer alır?", "dogruCevap": "Açıklanması durumunda ülkenin ekonomik çıkarlarına zarar verecek bilgiler", "yanlisCevaplar": ["Kurumun kamuya açıkladığı faaliyet raporları", "Bir şirketin sosyal sorumluluk projeleri", "Belediyenin ilan ettiği ihale sonuçları", "Bakanlık tarafından yayımlanan yıllık performans programı"]},
                    {"id": "bilgiedinme_139", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdaki bilgi veya belgelerden hangisi kural olarak bilgi edinme hakkı kapsamında yer almaz?", "dogruCevap": "Sivil ve askeri istihbarat birimlerinin faaliyet raporları", "yanlisCevaplar": ["Bir kamu kurumunun yıllık performans raporu", "Belediyenin bütçe tabloları", "Bakanlıkların düzenlediği kamu duyuruları", "Valilik karar özetleri"]},
                    {"id": "bilgiedinme_140", "soruMetni": "I. Sivil ve askeri istihbarat birimlerinin görev ve faaliyetlerine ilişkin belgeler kural olarak bilgi edinme hakkı dışındadır.\nII. İstihbarata ilişkin bilgi veya belgeler, kişilerin mesleki onurunu etkiliyorsa bilgi edinme kapsamında değerlendirilebilir.\nIII. İstihbarata ilişkin bilgiler tamamen gizlidir ve hiçbir durumda açıklanamaz.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangisi doğrudur?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "II ve III", "Yalnız III", "I, II ve III"]},

                    {"id": "bilgiedinme_143", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi bilgi edinme hakkı kapsamı dışında kalan durumlara örnektir?", "dogruCevap": "Soruşturmanın gizli bilgi kaynağının deşifre edilme riski", "yanlisCevaplar": ["Kurum içi eğitim duyuruları", "Kamuoyuna açıklanan veriler", "Mevzuata ilişkin özet bilgiler", "Bakanlıkların açık çağrıları"]},
                    {"id": "bilgiedinme_144", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre;\nI. Kişilerin özel hayatına açıkça haksız müdahale sonucunu doğuracak\nII. Kişilerin veya soruşturmayı yürüten görevlilerin hayatını ya da güvenliğini tehlikeye sokmayacak\nIII. Soruşturmanın güvenliğini tehlikeye düşürecek\nIV. Gizli kalması gereken bilgi kaynağının açığa çıkmasına neden olmayacak veya soruşturma ile ilgili benzeri bilgi ve bilgi kaynaklarının temin edilmesini güçleştirmeyecek\nKurum ve kuruluşların yetkili birimlerince yürütülen idari soruşturmalarla ilgili olup, açıklanması veya zamanından önce açıklanması hâlinde yukarıdaki hangileri ile ilgili bilgi ve belgeler bu Kanun kapsamı dışındadır?", "dogruCevap": "I ve III", "yanlisCevaplar": ["II ve IV", "I ve II", "II, III ve IV", "I, III ve IV"]},
                    {"id": "bilgiedinme_145", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, adli soruşturma veya kovuşturmaya ilişkin bir bilginin bilgi edinme hakkı kapsamı dışında kalmasına neden olur?", "dogruCevap": "Açıklanması hâlinde suç işlenmesine yol açacak bilgi olması", "yanlisCevaplar": ["İlgili kişinin kişisel kanaatleri", "Dava sürecine ilişkin haberlerin basında yer alması", "Sanığın sosyal çevresine ait genel bilgiler", "Soruşturmanın yapıldığı ilin nüfusu"]},
                    {"id": "bilgiedinme_146", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, açıklanması hâlinde bilgi edinme hakkı kapsamı dışına çıkarılacak nitelikte bir bilgi veya belge değildir?", "dogruCevap": "Kamu görevlisinin özlük dosyasındaki terfi evrakı", "yanlisCevaplar": ["Suç işlenmesine yol açacak bilgi ve belgeler", "Suçluların kanuni yollarla yakalanmasını tehlikeye düşürecek bilgiler", "Yargılama görevinin gereğince yerine getirilmesini engelleyecek bilgiler", "Hakkında dava açılmış bir kişinin adil yargılanma hakkını ihlâl edecek bilgiler"]},

                    {"id": "bilgiedinme_148", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, bilgi edinme hakkı kapsamında açıklanamayacak bilgi türlerinden biridir?", "dogruCevap": "Kişinin özel ve aile hayatına ilişkin mahrem bilgiler", "yanlisCevaplar": ["Kamuda çalışan kişilerin görev yerleri", "Genel sağlık politikaları", "Kamu ihale sonuçları", "Belediyelere yapılan başvurular"]},
                    {"id": "bilgiedinme_149", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, kamu yararı gözetilerek kişisel bilgilerin açıklanabilmesi için gerekli şartlardan biri değildir?", "dogruCevap": "Mahkeme kararı bulunması", "yanlisCevaplar": ["Kamu yararının bulunması", "İlgili kişinin yazılı rızasının alınması", "İlgili kişiye önceden haber verilmesi", "İlgili kişinin iznine başvurulması"]},

                    {"id": "bilgiedinme_151", "soruMetni": "I. Kişinin sağlık geçmişi\nII. Aile bireylerinin adres bilgileri\nIII. Kişinin yıllık vergi beyanı\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, özel hayatın gizliliği kapsamında yer alması nedeniyle yukarıdaki bilgilerden hangileri bilgi edinme hakkı kapsamı dışındadır?", "dogruCevap": "I, II ve III", "yanlisCevaplar": ["Yalnız I", "I ve II", "I ve III", "II ve III"]},
                    {"id": "bilgiedinme_152", "soruMetni": "Kamu yararının gerektirdiği hâllerde, kişisel bilgi veya belgeler, kurum ve kuruluşlar tarafından, ilgili kişiye en az ________ önceden haber verilerek yazılı rızası alınmak koşuluyla açıklanabilir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "7 gün", "yanlisCevaplar": ["3 gün", "5 iş günü", "15gün", "1 ay"]},
                    {"id": "bilgiedinme_153", "soruMetni": "Açıklanması halinde ________ esasını ihlâl edecek bilgi veya belgeler, bu Kanun kapsamı dışındadır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "Haberleşmenin gizliliği", "yanlisCevaplar": ["Özel mülkiyet", "Ticari reklam", "Görevli personel kimliği", "Mesleki yeterlilik"]},
                    {"id": "bilgiedinme_154", "soruMetni": "Kanunlarda ________ olarak nitelenen bilgi veya belgeler ile, kurum ve kuruluşlar tarafından gerçek veya tüzel kişilerden gizli kalması kaydıyla sağlanan ticari ve mali bilgiler, bu Kanun kapsamı dışındadır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "Ticari sır", "yanlisCevaplar": ["Basın bildirisi", "İç genelge", "Duyuru planı", "Kayıt defteri"]},
                    {"id": "bilgiedinme_155", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi bilgi edinme hakkı kapsamı dışında kalan durumlardan biridir?", "dogruCevap": "Kurumun kendi personeline yönelik iç uygulama düzenlemeleri", "yanlisCevaplar": ["Kurum çalışanlarının özlük haklarına ilişkin yönetmelikler", "Kurum tarafından yayımlanan kamu raporları", "Kurumun hizmet sunduğu vatandaşlara ait genel prosedürler", "Kamu ihale ilanları"]},
                    {"id": "bilgiedinme_156", "soruMetni": "I. Kurum içi uygulamalara ilişkin bilgi ve belgeler, kamuoyunu ilgilendirmediği takdirde bilgi edinme hakkı kapsamı dışındadır.\nII. Bu tür düzenlemelerden etkilenen kurum personelinin bilgi edinme hakkı saklıdır.\nIII. Kurum içi belgeler hiçbir şartla açıklanamaz.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangileri doğrudur?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "II ve III", "I ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_157", "soruMetni": "I. Kurum içi düzenlemeler sadece yöneticiler tarafından görülebilir.\nII. Kurum içi düzenlemelerden etkilenen çalışanlar bilgi talep edebilir.\nIII. Tüm kurum içi belgeler kamuya açıklanmak zorundadır.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangileri yanlıştır?", "dogruCevap": "I ve III", "yanlisCevaplar": ["II ve III", "Yalnız II", "I ve II", "I, II ve III"]},
                    {"id": "bilgiedinme_158", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, kurumun aksi bir karar almadıkça bilgi edinme hakkı kapsamında sayılır?", "dogruCevap": "Faaliyetlerin yürütülmesi amacıyla elde edilen bilgi notları", "yanlisCevaplar": ["Soruşturma sürecinde edinilen gizli ifadeler", "Mahkeme kararları öncesinde oluşturulan savunma metinleri", "Kurum içi disiplin cezalarına ilişkin personel görüşleri", "Kişisel veriler içeren bordro dökümleri"]},
                    {"id": "bilgiedinme_159", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi kurumların bilgi edinme talebine yanıt verirken açıklamakla yükümlü olabileceği bir uzman görüşü niteliğindedir?", "dogruCevap": "Kurum tarafından alınacak resmi kararlara esas teşkil eden ve ilgili uzman birim tarafından hazırlanmış tıbbi içerikli görüş raporu", "yanlisCevaplar": ["Kurum içinde sadece yöneticilerin kendi karar süreçlerinde kullandığı, resmi karara dayanmayan kişisel kanaat özetleri", "Herhangi bir idari ya da hukuki karar sürecinde kullanılmamış, genel içerikli danışmanlık analizleri", "Üçüncü şahısların kuruma sunduğu, doğruluğu denetlenmemiş şikayet mektupları", "Kurum içindeki çeşitli birimlerin henüz tamamlamadığı, istatistiksel dayanağı bulunmayan anket çalışmaları"]},
                    {"id": "bilgiedinme_160", "soruMetni": "I. Yalnızca akademik veya bilimsel bir dergide yayımlanmak üzere hazırlanmış ve herhangi bir karar sürecinde kullanılmamış uzman görüşleri, bilgi edinme kapsamı dışında kalabilir.\nII. Kurumun idari, hukuki veya teknik bir konuda vereceği kararın doğrudan dayanağını oluşturan uzman raporları, bilgi edinme hakkı kapsamında açıklanabilir.\nIII. Kurum içi değerlendirme, teklif ve yorumlardan oluşan bilgi notları, kurum tarafından aksi kararlaştırılmadıkça bilgi edinme kapsamına girer.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre kurumların uzman görüşü ve iç yazışmalarına ilişkin yükümlülükleri bakımından yukarıdakilerden hangileri doğrudur?", "dogruCevap": "I, II ve III", "yanlisCevaplar": ["Yalnız II", "I ve II", "II ve III", "I ve III"]},
                    {"id": "bilgiedinme_161", "soruMetni": "Kurum ve kuruluşların faaliyetlerini yürütmek üzere, elde ettikleri ________ : ________ ; ________ ve ________ niteliğindeki bilgi veya belgeler, kurum ve kuruluş tarafından aksi kararlaştırılmadıkça bilgi edinme hakkı kapsamındadır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluklara hangi ifadeler gelmelidir?", "dogruCevap": "Bilgi notu, görüş, teklif, tavsiye", "yanlisCevaplar": ["Rapor, analiz, karar, protokol", "Tavsiye, teklif, yorum, değerlendirme", "Şikâyet, tutanak, belge, itiraz", "Mevzuat, talimat, müzekkere, belge"]},
                    {"id": "bilgiedinme_162", "soruMetni": "I. Uzmanlık alanında verilen ve kurumsal kararların temelini oluşturan görüşler bilgi edinme kapsamına girer.\nII. Tıbbi ya da teknik içerikli uzman görüşleri yalnızca yargı kararı ile açıklanabilir.\nIII. Kurum tarafından alınmış açık bir karar yoksa, faaliyetle ilgili bilgi notları paylaşılabilir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre kurumların uzman görüşü ve iç yazışmalarına ilişkin yükümlülükleri bakımından yukarıdakilerden hangileri doğrudur?", "dogruCevap": "I ve III", "yanlisCevaplar": ["I ve II", "II ve III", "Yalnız II", "I, II ve III"]},
                    {"id": "bilgiedinme_163", "soruMetni": "Kurum ve kuruluşların faaliyetlerini yürütmek üzere, elde ettikleri görüş, bilgi notu, teklif ve tavsiye niteliğindeki bilgi veya belgeler, kurum ve kuruluş tarafından aksi kararlaştırılmadıkça bilgi edinme hakkı kapsamındadır. ……… ve ……….. talepleri Bilgi Edinme Hakkı Kanunu kapsamı dışındadır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluklara hangi ifade gelmelidir?", "dogruCevap": "Tavsiye — mütalaa", "yanlisCevaplar": ["Başvuru — karar", "Talep — değerlendirme", "Görüş- öneri", "Soru-— yanıt"]},
                    {"id": "bilgiedinme_164", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdaki taleplerden hangisi bilgi edinme hakkı kapsamında değildir?", "dogruCevap": "Kuruma yapılan tavsiye ve mütalaa talepleri", "yanlisCevaplar": ["İdari kararların dayanak belgeleri", "Kurum ve kuruluşların alacakları kararlara esas teşkil eden görüş ve bilgi notları", "Karara esas teşkil eden uzman raporları", "Yargı kararlarının uygulama bilgileri"]},
                    {"id": "bilgiedinme_165", "soruMetni": "………………. bilgi veya belgeler, Bilgi Edinme Hakkı Kanunu'nda belirtilen diğer istisnalar kapsamına girmiyor ise, bilgi edinme başvurularına açık hâle gelir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "Gizliliği kaldırılmış", "yanlisCevaplar": ["Resmi mühürlü", "Tasnif dışı", "Kurum onaylı", "Bilimsel nitelikli"]},
                    {"id": "bilgiedinme_166", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi gizliliği kaldırılmış bilgi veya belgenin bilgi edinme başvurusuna konu olabilmesi için zorunlu bir şarttır?", "dogruCevap": "Kanundaki diğer istisna hükümlerine girmemesi", "yanlisCevaplar": ["Belgenin üzerinden 10 yıl geçmiş olması", "İlgili kurumun yayımlamış olması", "Başvuru sahibinin akademisyen olması", "Belgenin noter tasdikli olması"]},
                    {"id": "bilgiedinme_167", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, bilgi edinme hakkının kötüye kullanımına karşı getirilmiş sınırlamalardan biridir?", "dogruCevap": "Bu Kanunla erişilen bilgiler ticari amaçla çoğaltılamaz ve kullanılamaz.", "yanlisCevaplar": ["Bilgi yalnızca devlet görevlilerine verilir.", "Bilgiler yalnızca sözlü olarak alınabilir.", "Erişim sadece yargı kararıyla mümkündür.", "Belgeler yalnızca noter onayıyla incelenebilir."]},
                    {"id": "bilgiedinme_168", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi veya belgeye erişim sürecinde görevli kamu personelinin görevini kasten, ihmalle veya kusurlu biçimde yerine getirmemesi hâlinde aşağıdakilerden hangisi uygulanabilir?", "dogruCevap": "Görevli hakkında disiplin hükümleri uygulanır; fiil ayrıca suç teşkil ediyorsa ceza kovuşturması mümkündür.", "yanlisCevaplar": ["İlgili görevli hakkında yalnızca uyarı cezası verilir.", "Görevli hakkında yalnızca memuriyetten çıkarma cezası verilir.", "Bilgiye erişim hakkı süresiz ertelenir.", "Bu durum bilgi edinme hakkının kapsamı dışında değerlendirilir."]},
                    {"id": "bilgiedinme_169", "soruMetni": "Bilgi Edinme Hakkı Kanunun uygulanmasında ihmâli, kusuru veya kastı bulunan memurlar ve diğer kamu görevlileri hakkında, işledikleri fiillerin genel hükümler çerçevesinde ________ gerektirmesi hususu saklı kalmak kaydıyla, tâbi oldukları mevzuatta yer alan ________ uygulanır. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluklara sırasıyla hangi ifade gelmelidir?", "dogruCevap": "Ceza kovuşturması / disiplin cezaları", "yanlisCevaplar": ["Soruşturma izni / idari yaptırımlar", "yargı kararı / kamu hizmetinden çıkarma", "denetim raporu / mali yaptırımlar", "bilgi gizliliği / etik uyarılar"]},
                    {"id": "bilgiedinme_170", "soruMetni": "Bilgi Edinme Hakkı Kanunu ile erişilen bilgi ve belgeler | ________ o çoğaltılamaz ve kullanılamaz. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "ticari amaçla", "yanlisCevaplar": ["eğitim kurumlarında", "kamu personeli arasında", "denetim süreçlerinde", "akademik çalışmalar için"]},
                    {"id": "bilgiedinme_171", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme yoluyla elde edilen bilgi ve belgelerle ilgili aşağıdakilerden hangisi doğrudur?", "dogruCevap": "Bilgi ve belgeler, ticari amaçla çoğaltılamaz ve kullanılamaz.", "yanlisCevaplar": ["Bilgiler üçüncü kişilere satılabilir.", "Elde edilen belgeler sosyal medya reklamlarında kullanılabilir.", "Kurumun onayı olmadan bilgiler işlenebilir ve paylaşılabilir.", "Belgeler, ticari kitaplarda kaynak gösterilmeden kullanılabilir."]},

                    {"id": "bilgiedinme_175", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, kurumların bilgi edinme başvurularına ilişkin raporları ne kadar süreyle hazırlaması gerekir?", "dogruCevap": "Yılda bir kez", "yanlisCevaplar": ["Altı ayda bir", "Her başvuru sonrası", "Aylık olarak", "Üç yılda bir"]},
                    {"id": "bilgiedinme_176", "soruMetni": "Kurumlar, bilgi edinme başvurularına ilişkin istatistik raporlarını her yıl en geç ________ ayının sonuna kadar Bilgi Edinme Değerlendirme Kurulu'na iletmelidir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa hangi ifade gelmelidir?", "dogruCevap": "Şubat", "yanlisCevaplar": ["Ocak", "Mart", "Nisan", "Mayıs"]},
                    {"id": "bilgiedinme_177", "soruMetni": "I. Kendilerine yapılan toplam bilgi edinme başvuru sayısı\nII. Reddedilen başvuru sayısı ve bunların dağılımını gösterir istatistik bilgileri\nIII.Kurum personeline ait adres ve iletişim bilgileri\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, kamu kurum ve kuruluşlarının Bilgi Edinme Değerlendirme Kurulu'na göndermekle yükümlü oldukları yıllık raporda yukarıdaki unsurlardan hangileri yer alır?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "II ve III", "I ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_178", "soruMetni": "I. Başvurusu reddedildikten sonra itiraz edilen başvuru sayısı\nII. Raporların her yıl Mart ayı sonuna kadar gönderilmesi\nIII. Olumlu sonuçlanan başvuru sayısı\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangileri, kamu kurumlarının Bilgi Edinme Değerlendirme Kurulu'na sundukları yıllık raporlarda yer alması gereken veya doğru olan bilgilerdendir?", "dogruCevap": "I ve III", "yanlisCevaplar": ["Yalnız I", "I ve II", "II ve III", "I, II ve III"]},
                    {"id": "bilgiedinme_179", "soruMetni": "I. Bilgi Edinme Değerlendirme Kurulu, genel raporu her yıl Nisan ayının sonuna kadar TBMM'ye gönderir.\nII. TBMM Başkanlığı, bu raporları kamuoyuyla paylaşmak zorunda değildir.\nIII. Bağlı kurumlar, raporlarını doğrudan Cumhurbaşkanlığı'na gönderir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdakilerden hangileri doğrudur?", "dogruCevap": "Yalnız I", "yanlisCevaplar": ["I ve II", "II ve III", "Yalnız III", "I, II ve III"]},
                    {"id": "bilgiedinme_180", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, aşağıdakilerden hangisi, Bilgi Edinme Değerlendirme Kurulu'nun yıllık genel rapor süreci ile ilgili doğru bir bilgidir?", "dogruCevap": "Kurul, tüm kurum raporlarını dikkate alarak Nisan ayı sonuna kadar TBMM'ye rapor sunar.", "yanlisCevaplar": ["Genel rapor her yıl Ocak ayında Cumhurbaşkanlığı'na sunulur.", "Raporlar yalnızca kamuoyuna açıklanır, TBMM'ye gönderilmez.", "Raporlar yalnızca Sayıştay tarafından değerlendirilir.", "Genel rapor gizlidir ve kamuoyuna açıklanmaz."]},
                    {"id": "bilgiedinme_181", "soruMetni": "Bilgi Edinme Değerlendirme Kurulu, hazırlayacağı genel raporu, söz konusu kurum ve kuruluşların raporları ile birlikte her yıl ________ ayının sonuna kadar ________ gönderir. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluklara sırasıyla hangi ifadeler gelmelidir?", "dogruCevap": "Nisan — Türkiye Büyük Millet Meclisine", "yanlisCevaplar": ["Mart— Cumhurbaşkanlığına", "Mayıs — Adalet Bakanlığına", "Haziran — Danıştay Başkanlığına", "Temmuz — Sayıştay'a"]},
                    {"id": "bilgiedinme_182", "soruMetni": "Türkiye Büyük Millet Meclisi Başkanlığı, Bilgi Edinme Değerlendirme Kurulu tarafından sunulan raporları takip eden ________ ay içinde kamuoyuna açıklar. 4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, yukarıdaki boşluğa ne gelmelidir?", "dogruCevap": "iki", "yanlisCevaplar": ["bir", "Üç", "dört", "beş"]},
                    {"id": "bilgiedinme_183", "soruMetni": "I. Bilgi Edinme Değerlendirme Kurulu, kamu kurum ve kuruluşlarının bilgi edinme başvurularına ilişkin yıllık raporlarını da dikkate alarak bir genel rapor hazırlar ve bu raporu her yıl Nisan ayının sonuna kadar Türkiye Büyük Millet Meclisi'ne sunar.\nII. Türkiye Büyük Millet Meclisi Başkanlığı, kendisine sunulan bu genel raporu takip eden iki ay içinde kamuoyuna açıklamakla yükümlüdür.\nIII. Bilgi edinme raporları yalnızca elektronik ortamda arşivlenir ve kamuoyuna açıklanması zorunlu değildir.\n4982 sayılı Bilgi Edinme Hakkı Kanunu'na göre, bilgi edinme sürecine ilişkin hazırlanan yıllık raporların kamuoyuyla paylaşımı hakkında aşağıdaki ifadelerden hangileri doğrudur?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "II ve III", "I ve III", "Yalnız III"]},

                    {"id": "bilgiedinme_192", "soruMetni": "4982 sayılı Bilgi Edinme Hakkı Kanunu göre;\nI. Türkiye'de yaşayan bir yabancı, doğrudan herhangi bir konuda bilgi talebinde bulunabilir.\nII. Yabancı tüzel kişiler, faaliyet alanlarıyla ilgili bilgi talep edebilir.\nIII. Karşılıklılık ilkesi, yabancıların bilgi edinme hakkını sınırlandıran bir unsurdur.\nIV. Türkiye'nin taraf olduğu uluslararası sözleşmelerden doğan hak ve yükümlülükleri saklıdır.\nYukarıdaki ifadelerden hangileri bilgi edinme hakkı ile ilgili yanlış ifadedir?", "dogruCevap": "Yalnız I", "yanlisCevaplar": ["I ve II", "II ve III", "I, II ve IV", "III ve IV"]},

                    {"id": "bilgiedinme_196", "soruMetni": "Türkiye'de ikamet eden bir yabancının 4982 sayılı Kanundan yararlanabilmesi bakımından;\nI. İstediği bilginin kendisiyle ilgili olması\nII. Karşılıklılık ilkesinin bulunması\nIII. Türk vatandaşıyla birlikte başvurması\nşartlarından hangileri aranır?", "dogruCevap": "I ve II", "yanlisCevaplar": ["Yalnız I", "Yalnız II", "II ve III", "I, II ve III"]},

                    {"id": "bilgiedinme_199", "soruMetni": "4982 sayılı Kanuna göre, istenen bilgi veya belge başvurulan kurum ve kuruluştan başka bir yerde bulunuyorsa aşağıdakilerden hangisi yapılır?", "dogruCevap": "Başvuru ilgili kurum ve kuruluşa gönderilir ve durum ilgiliye yazılı olarak bildirilir.", "yanlisCevaplar": ["Başvuru reddedilir.", "Başvuru BEDK'ya gönderilir.", "Başvuru Cumhurbaşkanlığına gönderilir.", "Başvuru sahibinden yeniden başvuru yapması istenir."]},

                    {"id": "kvkk_64", "soruMetni": "“Kişisel Verileri Koruma Kurumu, yıllık faaliyet raporunu ………. ve Türkiye Büyük Millet Meclisi İnsan Haklarını İnceleme Komisyonuna sunar.”\n6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, yukarıdaki bilgide boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?", "dogruCevap": "Cumhurbaşkanlığı", "yanlisCevaplar": ["Adalet Bakanlığı", "İçişleri Bakanlığı", "Anayasa Mahkemesi", "Avrupa İnsan Hakları Mahkemesi"]},
                    {"id": "kvkk_65", "soruMetni": "6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, aşağıdakilerden hangisi Kişisel Verileri Koruma Kurulu'nun görev ve yetkileriyle ilgili doğrudur?", "dogruCevap": "Kurul, kendi sorumluluğu altında bağımsız olarak görev ve yetkilerini kullanır.", "yanlisCevaplar": ["Kurul, görevlerini sadece hükümetin izniyle yerine getirir.", "Kurulun kararları, ilgili bakanlık tarafından onaylanmalıdır.", "Herhangi bir organ veya makam Kurula emir ve talimat verebilir.", "Kurulun faaliyetleri sadece mahkeme kararı ile denetlenebilir."]},
                    {"id": "kvkk_66", "soruMetni": "6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, Kişisel Verileri Koruma Kurulu kaç üyeden oluşur?", "dogruCevap": "9", "yanlisCevaplar": ["5", "7", "8", "12"]},
                    {"id": "kvkk_67", "soruMetni": "“Kişisel Verileri Koruma Kurulunun beş üyesi …... tarafından, dört üyesi ise …… tarafından seçilir.”\n6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, yukarıdaki bilgide boş bırakılan yerlere sırasıyla aşağıdakilerden hangileri getirilmelidir?", "dogruCevap": "Türkiye Büyük Millet Meclisi - Cumhurbaşkanı", "yanlisCevaplar": ["Cumhurbaşkanı - Türkiye Büyük Millet Meclisi", "Adalet Bakanlığı - Cumhurbaşkanı", "Adalet Bakanlığı - Türkiye Büyük Millet Meclisi", "Türkiye Büyük Millet Meclisi - Adalet Bakanlığı"]},
                    {"id": "kvkk_68", "soruMetni": "6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, aşağıdakilerden hangisi Kişisel Verileri Koruma Kurulu üyeliği için gerekli şartlardan biri değildir?", "dogruCevap": "En az on yıllık mesleki deneyime sahip olmak", "yanlisCevaplar": ["Kurumun görev alanındaki konularda bilgi ve deneyim sahibi olmak", "Herhangi bir siyasi parti üyesi olmamak", "En az dört yıllık lisans düzeyinde yükseköğrenim görmek", "657 sayılı Devlet Memurları Kanunu'nun belirttiği niteliklere sahip olmak"]},
                    {"id": "kvkk_69", "soruMetni": "\"Cumhurbaşkanı tarafından seçilen üyelerden birinin görev süresinin bitiminden …... gün önce veya herhangi bir sebeple görevin sona ermesi hâlinde durum, ……. gün içinde Kurum tarafından Cumhurbaşkanlığına bildirilir.”\n6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre,yukarıdaki bilgide boş bırakılan yerlere sırasıyla aşağıdakilerden hangileri getirilmelidir?", "dogruCevap": "Kırk beş – on beş", "yanlisCevaplar": ["Otuz – on beş", "Otuz – on dört", "On beş – kırk beş", "Otuz - on"]},
                    {"id": "kvkk_70", "soruMetni": "6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, Cumhurbaşkanı tarafından seçilen Kişisel Verileri Koruma Kurulu üyelerinin görev süresinin dolmasına ne kadar süre kala yeni üye seçimi yapılır?", "dogruCevap": "Bir ay", "yanlisCevaplar": ["15 gün", "45 gün", "İki ay", "Üç ay"]},
                    {"id": "kvkk_71", "soruMetni": "\"Cumhurbaşkanı tarafından seçilen üyelerden birinin görev süresinin bitiminden kırk beş gün önce veya herhangi bir sebeple görevin sona ermesi hâlinde durum, on beş gün içinde Kurum tarafından, Cumhurbaşkanlığına bildirilir. Üyelerin görev süresinin dolmasına bir ay kala yeni üye seçimi yapılır. Bu üyeliklerde, görev süresi dolmadan herhangi bir sebeple boşalma olması hâlinde ise bildirimden itibaren …….. gün içinde seçim yapılır.\"\n6698 sayılı Kişisel Verilerin Korunması Kanunu'na göre, Kişisel Verileri Koruma Kurulu ile ilgili yukarıdaki verilen bilgide boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?", "dogruCevap": "On beş", "yanlisCevaplar": ["yedi", "On", "Otuz", "kırk beş"]},
