<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçişleri GYS - Gelişmiş Soru Bankası</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Üst Menü -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-md font-bold cursor-pointer" onclick="goHome()">📚 GYS Soru Bankası</h1>
        <div class="text-xs flex gap-2">
            <button onclick="openGlobalFavorites()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-full transition">⭐ Favoriler (<span id="favCount">0</span>)</button>
            <button onclick="openGlobalWrongs()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-full transition">❌ Yanlışlar (<span id="wrongCount">0</span>)</button>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center">
        
        <!-- 1. ANA EKRAN -->
        <div id="homeScreen" class="space-y-4 my-4">
            <div class="bg-gradient-to-r from-orange-500 to-amber-500 p-5 rounded-2xl shadow-md text-white text-center cursor-pointer hover:opacity-95 transition" onclick="startDenemeSinavi()">
                <h2 class="text-xl font-bold">🎯 Genel Deneme Sınavı</h2>
                <p class="text-xs mt-1 text-orange-100">Havuzdaki Sorularla ÖSYM Simülasyonu</p>
            </div>

            <h2 class="text-base font-bold text-slate-700 mt-4 mb-2">Ders Seçerek Çalış (21 Kalem):</h2>
            <div id="courseList" class="space-y-2 pb-10"></div>
        </div>

        <!-- 2. DERS DETAY / MENÜ EKRANI -->
        <div id="courseDetailScreen" class="bg-white rounded-2xl shadow-xl p-6 hidden my-4 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <button onclick="goHome()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 font-medium hover:bg-slate-200">🏠 Ana Sayfa</button>
                <h2 id="detailCourseTitle" class="text-sm font-bold text-blue-600 text-right">Ders Adı</h2>
            </div>

            <div class="space-y-3 py-2">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="block text-xs font-bold text-slate-700 mb-2">Çözmek İstediğin Soru Adedini Seç:</label>
                    <div class="flex gap-2 mb-3">
                        <button onclick="setQuestionCount(5)" id="btnCount5" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-200 transition">5 Soru</button>
                        <button onclick="setQuestionCount(10)" id="btnCount10" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition">10 Soru</button>
                        <button onclick="setQuestionCount(20)" id="btnCount20" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition">20 Soru</button>
                        <button onclick="setQuestionCount('all')" id="btnCountAll" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition">Tümü</button>
                    </div>
                    <button onclick="startSelectedCourseQuiz()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition text-sm">▶️ Testi Başlat</button>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="openCourseFavorites()" class="p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-xs font-semibold hover:bg-amber-100 transition flex items-center justify-center gap-1">
                        ⭐ Dersin Favorileri (<span id="courseFavCount">0</span>)
                    </button>
                    <button onclick="openCourseWrongs()" class="p-3 bg-red-50 border border-red-200 text-red-800 rounded-xl text-xs font-semibold hover:bg-red-100 transition flex items-center justify-center gap-1">
                        ❌ Dersin Yanlışları (<span id="courseWrongCount">0</span>)
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. SORU ÇÖZÜM EKRANI -->
        <div id="quizContainer" class="bg-white rounded-2xl shadow-xl p-6 relative hidden my-4">
            <div class="flex justify-between items-center mb-4">
                <button onclick="goHome()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 font-medium hover:bg-slate-200">🏠 Çıkış</button>
                <div class="flex items-center space-x-2">
                    <span id="questionNumber" class="text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Soru 1/1</span>
                    <button onclick="toggleFavorite()" id="favBtn" class="text-2xl text-gray-300 hover:text-yellow-500 transition">⭐</button>
                </div>
            </div>

            <!-- Soru Metni -->
            <h2 id="questionText" class="text-base font-medium mb-4">Soru metni yükleniyor...</h2>

            <!-- Şıklar (A, B, C, D, E) -->
            <div id="optionsContainer" class="space-y-3"></div>

            <!-- Açıklama Alanı -->
            <div id="explanationContainer" class="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-600 hidden">
                <span class="font-bold text-blue-600 block mb-1">💡 Açıklama:</span>
                <p id="explanationText"></p>
            </div>

            <!-- Sonraki Soru Butonu -->
            <button id="nextBtn" onclick="nextQuestion()" class="mt-6 w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hidden hover:bg-blue-700 transition text-sm">Sonraki Soru ➡️</button>
        </div>

        <!-- 4. DETAYLI BİTİŞ / KARNE EKRANI -->
        <div id="resultContainer" class="bg-white rounded-2xl shadow-xl p-6 text-center hidden my-4 space-y-4">
            <h2 class="text-2xl font-bold text-blue-600">Sınav / Test Tamamlandı! 🎉</h2>
            
            <div class="grid grid-cols-3 gap-2 py-3">
                <div class="bg-green-50 p-3 rounded-xl border border-green-200">
                    <span class="block text-[11px] text-green-600 font-bold">DOĞRU</span>
                    <span id="resTrue" class="text-lg font-bold text-green-700">0</span>
                </div>
                <div class="bg-red-50 p-3 rounded-xl border border-red-200">
                    <span class="block text-[11px] text-red-600 font-bold">YANLIŞ</span>
                    <span id="resFalse" class="text-lg font-bold text-red-700">0</span>
                </div>
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-200">
                    <span class="block text-[11px] text-blue-600 font-bold">BAŞARI</span>
                    <span id="resSuccess" class="text-lg font-bold text-blue-700">%0</span>
                </div>
            </div>

            <button onclick="goHome()" class="w-full bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold hover:bg-blue-700 transition text-sm">Ana Sayfaya Dön</button>
        </div>

    </main>

        {

            dogruCevap: "Cumhuriyet başsavcılıklarına suç duyurusunda bulunurlar",
            yanlisCevaplar: [

            dogruCevap: "Yapılan incelemede mal bildiriminde gerçeğe aykırılık tespit edilmesi",
            yanlisCevaplar: [
                "Mal bildiriminin eksik doldurulması",
                "Mal bildirimini zamanında vermemesi",
                "Mal bildirim formunun kaybolması",
                "Mal bildirimi yapmak istememeleri"
            ],
            aciklama: "Gerçeğe aykırı bildirimde bulunulduğunun veya mal kaçırıldığının/gizlendiğinin tespiti suç duyurusu sebebidir."

        ];

        let activeQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let wrongCountScore = 0;
        let selectedCourseId = null;
        let selectedQuestionCount = 5;
        
        let favorites = JSON.parse(localStorage.getItem("gys_favorites")) || [];
        let wrongAnswers = JSON.parse(localStorage.getItem("gys_wrongs")) || [];

        let currentShuffledOptions = [];
        let correctAnswerText = "";

        function updateGlobalCounts() {
            document.getElementById("favCount").innerText = favorites.length;
            document.getElementById("wrongCount").innerText = wrongAnswers.length;
            localStorage.setItem("gys_favorites", JSON.stringify(favorites));
            localStorage.setItem("gys_wrongs", JSON.stringify(wrongAnswers));
        }

        function initHome() {
            updateGlobalCounts();
            const courseList = document.getElementById("courseList");
            courseList.innerHTML = "";

            veriTabani.forEach(ders => {
                const card = document.createElement("div");
                card.className = "bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-pointer flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-700 text-xs">${ders.dersAdi}</h3>
                        <p class="text-[11px] text-slate-500 mt-0.5">Sınav Soru: ${ders.sinavSoruSayisi} | Havuz: ${ders.sorular.length}</p>
                    </div>
                    <span class="bg-blue-50 text-blue-600 px-2.5 py-1.5 rounded-lg font-semibold text-xs whitespace-nowrap ml-2">Seç ➔</span>
                `;
                card.onclick = () => openCourseDetail(ders.id);
                courseList.appendChild(card);
            });

            document.getElementById("homeScreen").classList.remove("hidden");
            document.getElementById("courseDetailScreen").classList.add("hidden");
            document.getElementById("quizContainer").classList.add("hidden");
            document.getElementById("resultContainer").classList.add("hidden");
        }

        function openCourseDetail(courseId) {
            const ders = veriTabani.find(d => d.id === courseId);
            if(!ders || ders.sorular.length === 0) {
                alert("Bu derse henüz soru eklenmemiş! Soru eklediğinizde açılacaktır.");
                return;
            }
            selectedCourseId = courseId;
            document.getElementById("detailCourseTitle").innerText = ders.dersAdi;

            document.getElementById("courseFavCount").innerText = favorites.filter(q => q.id.startsWith("dilekce_") || q.id.startsWith("tr_")).length; // Filtre esnekliği
            document.getElementById("courseWrongCount").innerText = wrongAnswers.filter(q => q.id.startsWith("dilekce_") || q.id.startsWith("tr_")).length;

            document.getElementById("homeScreen").classList.add("hidden");
            document.getElementById("courseDetailScreen").classList.remove("hidden");
        }

        function setQuestionCount(count) {
            selectedQuestionCount = count;
            ['5', '10', '20', 'All'].forEach(c => {
                const btn = document.getElementById(`btnCount${c}`);
                if(btn) {
                    btn.className = "flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 transition";
                }
            });
            const activeBtn = document.getElementById(`btnCount${count === 'all' ? 'All' : count}`);
            if(activeBtn) {
                activeBtn.className = "flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-200 transition";
            }
        }

        function startSelectedCourseQuiz() {
            const ders = veriTabani.find(d => d.id === selectedCourseId);
            let pool = [...ders.sorular].sort(() => Math.random() - 0.5);

            if(selectedQuestionCount !== 'all' && pool.length > selectedQuestionCount) {
                pool = pool.slice(0, selectedQuestionCount);
            }

            activeQuestions = pool;
            beginQuiz();
        }

        function startDenemeSinavi() {
            let tumSorular = [];
            veriTabani.forEach(ders => { tumSorular.push(...ders.sorular); });
            if(tumSorular.length === 0) { alert("Sistemde henüz hiç soru bulunmuyor!"); return; }
            
            activeQuestions = tumSorular.sort(() => Math.random() - 0.5);
            beginQuiz();
        }

        function openGlobalFavorites() {
            if(favorites.length === 0) { alert("Favori soru yok!"); return; }
            activeQuestions = [...favorites];
            beginQuiz();
        }

        function openGlobalWrongs() {
            if(wrongAnswers.length === 0) { alert("Yanlış yapılan soru yok!"); return; }
            activeQuestions = [...wrongAnswers];
            beginQuiz();
        }

        function openCourseFavorites() {
            const dersFavs = favorites.filter(q => q.id.startsWith("dilekce_"));
            if(dersFavs.length === 0) { alert("Bu derse ait favori soru yok!"); return; }
            activeQuestions = dersFavs;
            beginQuiz();
        }

        function openCourseWrongs() {
            const dersWrongs = wrongAnswers.filter(q => q.id.startsWith("dilekce_"));
            if(dersWrongs.length === 0) { alert("Bu derse ait yanlış yapılan soru yok!"); return; }
            activeQuestions = dersWrongs;
            beginQuiz();
        }

        function beginQuiz() {
            currentIndex = 0;
            score = 0;
            wrongCountScore = 0;
            document.getElementById("homeScreen").classList.add("hidden");
            document.getElementById("courseDetailScreen").classList.add("hidden");
            document.getElementById("quizContainer").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuestions[currentIndex];
            document.getElementById("questionNumber").innerText = `Soru ${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById("questionText").innerText = q.soruMetni;
            correctAnswerText = q.dogruCevap;

            let allOptions = [q.dogruCevap, ...q.yanlisCevaplar];
            currentShuffledOptions = allOptions.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            const harfler = ["A", "B", "C", "D", "E"];
            currentShuffledOptions.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition font-medium flex items-center justify-between text-xs";
                btn.innerHTML = `<span class="bg-slate-100 w-6 h-6 rounded-lg flex items-center justify-center font-bold text-slate-600 mr-3 shrink-0">${harfler[index]}</span> <span class="flex-1">${option}</span>`;
                btn.onclick = () => checkAnswer(option, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById("explanationContainer").classList.add("hidden");
            document.getElementById("nextBtn").classList.add("hidden");
            updateFavButtonUI();
        }

        function checkAnswer(selectedOption, selectedBtn) {
            const allBtns = document.getElementById("optionsContainer").getElementsByTagName("button");
            const currentQ = activeQuestions[currentIndex];
            
            for (let btn of allBtns) {
                btn.disabled = true;
                if (btn.innerText.includes(correctAnswerText)) {
                    btn.classList.add("bg-green-100", "border-green-500", "text-green-800");
                }
            }

            if (selectedOption === correctAnswerText) {
                score++;
                wrongAnswers = wrongAnswers.filter(item => item.id !== currentQ.id);
            } else {
                wrongCountScore++;
                selectedBtn.classList.add("bg-red-100", "border-red-500", "text-red-800");
                if(!wrongAnswers.some(item => item.id === currentQ.id)) { wrongAnswers.push(currentQ); }
            }

            updateGlobalCounts();

            if(currentQ.aciklama) {
                document.getElementById("explanationText").innerText = currentQ.aciklama;
                document.getElementById("explanationContainer").classList.remove("hidden");
            }

            document.getElementById("nextBtn").classList.remove("hidden");
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById("quizContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                
                // Karne İstatistikleri
                document.getElementById("resTrue").innerText = score;
                document.getElementById("resFalse").innerText = wrongCountScore;
                const successRate = Math.round((score / activeQuestions.length) * 100);
                document.getElementById("resSuccess").innerText = `%${successRate}`;
            }
        }

        function toggleFavorite() {
            const q = activeQuestions[currentIndex];
            const exists = favorites.some(item => item.id === q.id);
            if (exists) {
                favorites = favorites.filter(item => item.id !== q.id);
            } else {
                favorites.push(q);
            }
            updateGlobalCounts();
            updateFavButtonUI();
        }

        function updateFavButtonUI() {
            const q = activeQuestions[currentIndex];
            const favBtn = document.getElementById("favBtn");
            const isFav = favorites.some(item => item.id === q.id);
            if (isFav) {
                favBtn.classList.remove("text-gray-300");
                favBtn.classList.add("text-yellow-500");
            } else {
                favBtn.classList.add("text-gray-300");
                favBtn.classList.remove("text-yellow-500");
            }
        }

        function goHome() {
            initHome();
        }

        initHome();
    </script>
